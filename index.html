    // Haversine Real-World Distance Calculator (Meters)
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const toRad = (d) => (d * Math.PI) / 180;
      const a =
        Math.sin(toRad(lat2 - lat1) / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(toRad(lon2 - lon1) / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function getConstructionYearRange(record) {
      const value = record.dateConstructed || record.yearFounded;
      if (typeof value !== 'string' || value.trim() === '') return null;
      const normalized = value.replace(/[\u2010-\u2015\u2212]/g, '-').trim();
      const century = normalized.match(/(?:(first|second|early|late)\s+(?:half\s+of\s+)?)?(\d{1,2})(?:st|nd|rd|th)(?:\s*-\s*(\d{1,2})(?:st|nd|rd|th))?\s*(?:century|c\.?)/i);
      if (century) {
        const firstCentury = Number(century[2]);
        const lastCentury = Number(century[3] || century[2]);
        let start = (firstCentury - 1) * 100 + 1;
        let end = lastCentury * 100;
        const period = century[1]?.toLowerCase();
        if (firstCentury === lastCentury && (period === 'first' || period === 'early')) {
          end = start + 49;
        } else if (firstCentury === lastCentury && (period === 'second' || period === 'late')) {
          start += 50;
        }
        return { start, end };
      }

      const numericDate = normalized.match(/\b(\d{1,4})(?:\s*-\s*(\d{1,4}))?\b/);
      if (numericDate) {
        return {
          start: Number(numericDate[1]),
          end: Number(numericDate[2] || numericDate[1])
        };
      }

      const romanDate = normalized.match(/^\s*([MDCLXVI]{3,})\b/i);
      if (!romanDate) return null;
      const values = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
      const numerals = romanDate[1].toUpperCase();
      let total = 0;
      for (let index = 0; index < numerals.length; index += 1) {
        const current = values[numerals[index]];
        const next = values[numerals[index + 1]] || 0;
        total += current < next ? -current : current;
      }
      return { start: total, end: total };
    }

    function matchesConstructionYearRange(record, yearFrom, yearTo) {
      if (yearFrom === '' && yearTo === '') return true;
      const lowerBound = yearFrom === '' ? -Infinity : Number(yearFrom);
      const upperBound = yearTo === '' ? Infinity : Number(yearTo);
      if (lowerBound > upperBound) return true;
      const constructionYears = getConstructionYearRange(record);
      return Boolean(constructionYears)
        && constructionYears.end >= lowerBound
        && constructionYears.start <= upperBound;
    }

    function matchesSiteConstructionYearRange(site, yearFrom, yearTo) {
      return site.type === 'anchor' || matchesConstructionYearRange(site, yearFrom, yearTo);
    }

    const CURRENT_YEAR = new Date().getFullYear();

    function getAvailableRouteGenres(sites) {
      return [...new Set(sites.flatMap((site) => (
        Array.isArray(site.genre) ? site.genre : []
      )))];
    }

    function getCollectionRouteGenres(collections, availableGenres) {
      const collectionGenres = [];
      if (collections.churches) collectionGenres.push('Religious');
      if (collections.confraternities) collectionGenres.push('Guilds & Glass');
      if (collections.doges) collectionGenres.push('Politics & Republic');
      if (collections.inscriptions) collectionGenres.push('Everyday Life', 'Guilds & Glass');
      if (collections.tassiniHeritage) collectionGenres.push('Everyday Life');
      const availableGenreSet = new Set(availableGenres);
      return [...new Set(collectionGenres)]
        .filter((genre) => availableGenreSet.has(genre));
    }

    function orderRouteStops(stopIds, interests, startLocation) {
      if (interests.length === 0) return stopIds;
      const remaining = stopIds
        .map((id, selectionIndex) => ({
          site: VENICE_SITES.find((item) => item.id === id),
          selectionIndex
        }))
        .filter((entry) => entry.site);
      const ordered = [];
      let current = startLocation;
      const getPreferencePriority = (site) => {
        const priorities = site.genre
          .map((genre) => interests.indexOf(genre))
          .filter((index) => index >= 0);
        return priorities.length > 0 ? Math.min(...priorities) : Infinity;
      };

      if (!current && remaining.length > 0) {
        const matching = remaining.filter(({ site }) => getPreferencePriority(site) !== Infinity);
        const bestPriority = matching.length > 0
          ? Math.min(...matching.map(({ site }) => getPreferencePriority(site)))
          : Infinity;
        const firstCandidates = bestPriority === Infinity
          ? remaining
          : matching.filter(({ site }) => getPreferencePriority(site) === bestPriority);
        firstCandidates.sort((a, b) => a.selectionIndex - b.selectionIndex);
        const first = firstCandidates[0];
        ordered.push(first);
        remaining.splice(remaining.findIndex((entry) => entry.site.id === first.site.id), 1);
        current = first.site;
      }

      while (remaining.length > 0) {
        const matching = remaining.filter(({ site }) => site.genre.some((genre) => interests.includes(genre)));
        const bestPriority = matching.length > 0
          ? Math.min(...matching.map(({ site }) => getPreferencePriority(site)))
          : Infinity;
        const preferredGroup = matching.length > 0
          ? matching.filter(({ site }) => getPreferencePriority(site) === bestPriority)
          : remaining;
        preferredGroup.sort((a, b) => {
          const aDistance = current
            ? getDistanceMeters(current.lat, current.lng, a.site.lat, a.site.lng)
            : a.selectionIndex;
          const bDistance = current
            ? getDistanceMeters(current.lat, current.lng, b.site.lat, b.site.lng)
            : b.selectionIndex;
          return aDistance - bDistance || a.selectionIndex - b.selectionIndex;
        });
        const next = preferredGroup[0];
        ordered.push(next);
        remaining.splice(remaining.findIndex((entry) => entry.site.id === next.site.id), 1);
        current = next.site;
      }

      return ordered.map(({ site }) => site.id);
    }

    function getExhibitBrief(record) {
      const text = record.description || record.narrativeScript || record.historicalContext
        || record.contributionToHistory || record.routeConnection || '';
      const cleanText = String(text).replace(/\s+/g, ' ').trim();
      const firstSentence = cleanText.match(/^.{1,180}?[.!?](?=\s|$)/);
      if (firstSentence) return firstSentence[0];
      return cleanText.length > 180 ? `${cleanText.slice(0, 177).trimEnd()}…` : cleanText;
    }

    function ExhibitLabel({ record, showTitle = true }) {
      const creator = record.creator || record.artist || record.architect;
      const creationDate = record.dateConstructed || record.yearFounded;
      const material = record.material;
      const description = getExhibitBrief(record);
      return (
        <div className="exhibit-label">
          {showTitle && <h3>{record.name}</h3>}
          {(creator || creationDate || material) && (
            <dl className="exhibit-label-meta">
              {creator && <div><dt>Creator</dt><dd>{creator}</dd></div>}
              {creationDate && <div><dt>Creation date</dt><dd>{creationDate}</dd></div>}
              {material && <div><dt>Material</dt><dd>{material}</dd></div>}
            </dl>
          )}
          {description && <p>{description}</p>}
        </div>
      );
    }

    // Complete Dataset combining Tour Information + WPI IQPs + GNA

      { id: 'guilds', title: "Medieval Guilds & Venetian Commerce", duration: "San Polo & Santa Croce walk", stops: ['rialto-bridge', 'calle-dei-fuseri', 'scuola-san-giovanni', 'ca-pesaro'] }

      const mapContainerRef = useRef(null);

      useEffect(() => {
        const updateLayout = () => setCompactLayout(window.matchMedia('(max-width: 1023px)').matches);
        window.addEventListener('resize', updateLayout);
        return () => window.removeEventListener('resize', updateLayout);
      }, []);

      const beginPanelResize = (panel, event) => {
        event.preventDefault();
        event.currentTarget.setPointerCapture(event.pointerId);
        resizeStartRef.current = {
          panel,
          axis: window.matchMedia('(max-width: 1023px)').matches ? 'y' : 'x',
          x: event.clientX,
          y: event.clientY,
          ...panelSizes
        };
      };

      const movePanelResize = (event) => {
        const start = resizeStartRef.current;
        if (!start) return;
        const delta = start.axis === 'x' ? event.clientX - start.x : event.clientY - start.y;
        setPanelSizes((current) => {
          if (start.panel === 'sidebar') {
            const size = start.axis === 'x' ? 'sidebarWidth' : 'sidebarHeight';
            const min = start.axis === 'x' ? 250 : 180;
            const max = start.axis === 'x' ? Math.min(520, window.innerWidth * 0.48) : Math.min(520, window.innerHeight * 0.7);
            return { ...current, [size]: Math.round(Math.max(min, Math.min(max, start[size] + delta))) };
          }
          const size = start.axis === 'x' ? 'researchWidth' : 'researchHeight';
          const min = start.axis === 'x' ? 300 : 180;
          const max = start.axis === 'x' ? Math.min(520, window.innerWidth * 0.48) : Math.min(520, window.innerHeight * 0.7);
          return { ...current, [size]: Math.round(Math.max(min, Math.min(max, start[size] - delta))) };
        });
      };

      const stopPanelResize = () => {
        resizeStartRef.current = null;
      };

      const handlePanelResizeKeyDown = (panel, event) => {
        const horizontal = window.matchMedia('(max-width: 1023px)').matches;
        const amount = event.shiftKey ? 40 : 16;
        const key = horizontal
          ? (event.key === 'ArrowDown' ? 'increase' : event.key === 'ArrowUp' ? 'decrease' : null)
          : (event.key === 'ArrowRight' ? 'increase' : event.key === 'ArrowLeft' ? 'decrease' : null);
        if (!key) return;
        event.preventDefault();
        const direction = key === 'increase' ? 1 : -1;
        setPanelSizes((current) => {
          const size = panel === 'sidebar'
            ? (horizontal ? 'sidebarHeight' : 'sidebarWidth')
            : (horizontal ? 'researchHeight' : 'researchWidth');
          const min = horizontal ? 180 : panel === 'sidebar' ? 250 : 300;
          const max = horizontal
            ? Math.min(520, window.innerHeight * 0.7)
            : Math.min(520, window.innerWidth * 0.48);
          const panelDirection = panel === 'sidebar' ? direction : -direction;
          return { ...current, [size]: Math.round(Math.max(min, Math.min(max, current[size] + amount * panelDirection))) };
        });
      };

      useEffect(() => {
        let cancelled = false;
        const today = new Date();
        const historyDate = `${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        Promise.all([
          fetch('/api/sites').then(async (response) => {
            if (!response.ok) throw new Error(`Landmark data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/fountains').then(async (response) => {
            if (!response.ok) throw new Error(`Fountain data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/churches').then(async (response) => {
            if (!response.ok) throw new Error(`Church data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/confraternities').then(async (response) => {
            if (!response.ok) throw new Error(`Confraternity data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/doges').then(async (response) => {
            if (!response.ok) throw new Error(`Doge and dynasty data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/inscriptions').then(async (response) => {
            if (!response.ok) throw new Error(`Inscription data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/tassini-heritage').then(async (response) => {
            if (!response.ok) throw new Error(`Tassini heritage data request failed (${response.status}).`);
            return response.json();
          }),
          fetch(`/api/today-in-venice-history?date=${historyDate}`).then(async (response) => {
            if (!response.ok) throw new Error(`Today in Venice history request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/venice-history-timeline').then(async (response) => {
            if (!response.ok) throw new Error(`Venice history timeline request failed (${response.status}).`);
            return response.json();
          })
        ]).then(([sites, fountains, churches, confraternities, doges, inscriptions, tassiniHeritage, todayEvents, historyEvents]) => {
          if (!Array.isArray(sites) || !Array.isArray(fountains) || !Array.isArray(churches)
            || !Array.isArray(confraternities) || !Array.isArray(doges) || !Array.isArray(inscriptions)
            || !Array.isArray(tassiniHeritage) || !Array.isArray(todayEvents) || !Array.isArray(historyEvents)
            || sites.length === 0 || churches.length === 0 || confraternities.length === 0
            || doges.length === 0 || inscriptions.length === 0 || tassiniHeritage.length === 0
            || todayEvents.length === 0 || todayEvents.length > 3 || historyEvents.length === 0) {
            throw new Error("The server returned an invalid or empty Venice dataset.");
          }
          if (cancelled) return;
          VENICE_SITES = sites;
          DRINKING_FOUNTAINS = fountains;
          VENETIAN_CHURCHES = churches;
          VENETIAN_CONFRATERNITIES = confraternities;
          VENETIAN_DOGES = doges;
          VENETIAN_INSCRIPTIONS = inscriptions;
          VENETIAN_TASSINI_HERITAGE = tassiniHeritage;
          setTodayHistoryEvent(todayEvents[Math.floor(Math.random() * todayEvents.length)]);
          setHistoryTimeline(historyEvents);
          setMapStatusText(`${sites.length} landmarks, ${churches.length} churches, ${confraternities.length} confraternities & guilds, ${doges.length} doge locations, ${inscriptions.length} inscriptions & street altars, ${tassiniHeritage.length} Tassini heritage records, ${fountains.length} fountains`);
          setDataReady(true);
          setDataLoadError('');
        }).catch((error) => {
          if (cancelled) return;
          setDataLoadError(error.message || "Could not load the Data catalog.");
        });
        return () => { cancelled = true; };
      }, [dataLoadAttempt]);

      useEffect(() => {
        if (dataReady && activeMode === 'home' && todayHistoryEvent && !todayHistoryPopupShownRef.current) {
          todayHistoryPopupShownRef.current = true;
          setShowTodayHistoryPopup(true);
        }
      }, [dataReady, activeMode, todayHistoryEvent]);

      useEffect(() => {
        if (!showTodayHistoryPopup) return undefined;
        const handleKeyDown = (event) => {
          if (event.key === 'Escape') setShowTodayHistoryPopup(false);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [showTodayHistoryPopup]);

      useEffect(() => {
        if (!selectedDataRecord) return undefined;
        const handleKeyDown = (event) => {
          if (event.key === 'Escape') setSelectedDataRecord(null);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedDataRecord]);

      const activeRouteSites = useMemo(() => activeRouteIds.map((id) => VENICE_SITES.find((s) => s.id === id)).filter(Boolean), [activeRouteIds]);
      const availableRouteGenres = getAvailableRouteGenres(VENICE_SITES);
      const builtYearRangeInvalid = builtYearFrom !== '' && builtYearTo !== ''
        && Number(builtYearFrom) > Number(builtYearTo);
      const isWithinBuiltYearRange = (record) => matchesSiteConstructionYearRange(
        record,
        builtYearFrom,
        builtYearTo

        const effectiveRouteInterests = getCollectionRouteGenres({

          const response = await fetch('/api/routes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              stopIds: orderedStopIds,
              accessibleOnly,
              useBoats,
              ...(startLocation ? { startLocation: { lat: startLocation.lat, lng: startLocation.lng } } : {})
            })
          });
          const result = await response.json();
          if (requestId !== routeRequestIdRef.current) return;
          if (!response.ok) throw new Error(result.error || `Route request failed (${response.status}).`);
          if (!Array.isArray(result.route) || result.route.length !== orderedStopIds.length
            || !Array.isArray(result.legs)
            || result.legs.length !== orderedStopIds.length - 1 + (startLocation ? 1 : 0)
            || result.startedFromCurrentLocation !== Boolean(startLocation)) {
            throw new Error("The routing service returned an incomplete route.");
          }
          const routeSites = result.route.map((id) => VENICE_SITES.find((site) => site.id === id));
          if (routeSites.some((site) => !site)) throw new Error("The server returned a route with an unknown landmark.");
          if (result.route.some((id, index) => id !== orderedStopIds[index])) {
            throw new Error("The routing service changed your personalized stop order.");
          }
          if (result.legs.some((leg) => !Array.isArray(leg.geometry) || leg.geometry.length < 2
            || leg.geometry.some((point) => !Array.isArray(point) || point.length !== 2
              || !point.every((coordinate) => Number.isFinite(coordinate)))
            || typeof leg.fromName !== 'string'
            || !Number.isFinite(Number(leg.distanceKm)) || !Number.isFinite(Number(leg.durationMinutes))
            || typeof leg.hasFerry !== 'boolean'
            || !Array.isArray(leg.instructions))) {
            throw new Error("The routing service returned an incomplete route leg.");
          }
          if (!useBoats && result.legs.some((leg) => leg.hasFerry)) {
            throw new Error("The selected route needs a boat connection. Turn on boat connections or choose another route.");
          }
          const distanceKm = Number(result.distanceKm);
          const durationMinutes = Number(result.durationMinutes);
          if (!Number.isFinite(distanceKm) || !Number.isFinite(durationMinutes)) {
            throw new Error("The routing service returned invalid route details.");
          }
          setActiveRouteIds(result.route);
          setRouteLegs(result.legs);
          setRouteSummary({ distanceKm, durationMinutes });
          const ferryCount = result.legs.filter((leg) => leg.hasFerry).length;
          setMapStatusText(`${startLocation ? 'From your current location • ' : ''}${result.routingProvider}: ${distanceKm.toFixed(2)} km, about ${durationMinutes} min${ferryCount ? ` • ${ferryCount} boat leg${ferryCount === 1 ? '' : 's'}` : ''}`);
        } catch (error) {
          if (requestId === routeRequestIdRef.current) {
            setMapStatusText(error.message || "Could not build the route. Please try again.");
          }
        } finally {
          if (requestId === routeRequestIdRef.current) setIsBuildingRoute(false);
        }
      };

      const handleBuildStoryRoute = () => requestWalkingRoute(selectedStopIds);

      const handleRouteStartLocationChange = (event) => {
        if (!event.target.checked) {
          setRouteStartFromLocation(false);
          setRouteStartLocation(null);
          clearActiveRoute();
          setMapStatusText("Route start reset to the first selected landmark.");
          return;
        }
        if (!navigator.geolocation) {
          setMapStatusText("Location is unavailable in this browser; use Near Me (GPS) to set a location.");
          return;
        }
        setMapStatusText("Getting your current location for the route...");
        navigator.geolocation.getCurrentPosition(
          ({ coords }) => {
            const location = {
              lat: coords.latitude,
              lng: coords.longitude,
              label: "Your location"
            };
            setRouteStartLocation(location);
            setUserGpsPos(location);
            setRouteStartFromLocation(true);
            clearActiveRoute();
            setMapStatusText("Current location acquired. Build a route to start there.");
          },
          (error) => {
            const message = error.code === error.PERMISSION_DENIED
              ? "Location permission was denied. Allow location access and try again."
              : error.code === error.TIMEOUT
                ? "Getting your location timed out. Try again."
                : "Could not get your location. Check device location settings.";
            setMapStatusText(message);
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
        );
      };

      useEffect(() => {
        if (dataReady && selectedStopIds.length > 0) requestWalkingRoute(selectedStopIds);
      }, [dataReady]);

      const clearActiveRoute = () => {
        routeRequestIdRef.current += 1;
        setIsBuildingRoute(false);
        setActiveRouteIds([]);
        setRouteLegs([]);
        setRouteSummary(null);
      };

      const handleCollectionPreferenceChange = (setPreference, enabled) => {
        setPreference(enabled);
        clearActiveRoute();
        setMapStatusText("Collection preferences changed. Build a route to prioritize matching landmarks.");
      };

      const handleBuiltYearChange = (bound, value) => {
        const nextFrom = bound === 'from' ? value : builtYearFrom;
        const nextTo = bound === 'to' ? value : builtYearTo;
        setBuiltYearFrom(nextFrom);
        setBuiltYearTo(nextTo);
        clearActiveRoute();

        if (nextFrom === '' || nextTo === '' || Number(nextFrom) <= Number(nextTo)) {
          const matchesNextYearRange = (id) => {
            const site = VENICE_SITES.find((item) => item.id === id);
            return site && matchesSiteConstructionYearRange(site, nextFrom, nextTo);
          };
          setSelectedStopIds((current) => current.filter(matchesNextYearRange));
          setDraftStopIds((current) => current.filter(matchesNextYearRange));
        }

        if (activeMode !== 'research-hub') {
          if (selectedSite && !matchesSiteConstructionYearRange(selectedSite, nextFrom, nextTo)) {
            setSelectedSite(null);
          }
          if (selectedResearchLocation
            && !matchesConstructionYearRange(selectedResearchLocation, nextFrom, nextTo)) {
            setSelectedResearchLocation(null);
            setSelectedChurch(null);
          }
        }

        if (nextFrom !== '' && nextTo !== '' && Number(nextFrom) > Number(nextTo)) {
          setMapStatusText("The earliest year must be before or equal to the latest year.");
        } else if (nextFrom === '' && nextTo === '') {
          setMapStatusText("Built-year filter cleared.");
        } else {
          setMapStatusText("Built-year range updated for route stops and nearby finds.");
        }
      };

      const handleToggleLocationTracking = () => {
        if (gpsWatchIdRef.current !== null) {
          navigator.geolocation.clearWatch(gpsWatchIdRef.current);
          gpsWatchIdRef.current = null;
          setIsTrackingLocation(false);
          setMapStatusText("Live location stopped");
          return;
        }
        if (!navigator.geolocation) {
          setMapStatusText("Location is unavailable in this browser; drag the map pin instead.");
          return;
        }
        setIsDemoLocation(false);
        gpsWatchIdRef.current = navigator.geolocation.watchPosition(
          ({ coords }) => {
            setUserGpsPos({ lat: coords.latitude, lng: coords.longitude, label: "Your location" });
            setMapStatusText("Live location active — showing preferred nearby artifacts");
          },
          (error) => {
            const message = error.code === error.PERMISSION_DENIED
              ? "Location permission was denied; drag the map pin instead."
              : error.code === error.TIMEOUT
                ? "Location timed out; try again or drag the map pin."
                : "Could not track your location; check device location settings.";
            if (gpsWatchIdRef.current !== null) navigator.geolocation.clearWatch(gpsWatchIdRef.current);
            gpsWatchIdRef.current = null;
            setIsTrackingLocation(false);
            setMapStatusText(message);
          }, {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 15000
          }
        );
        setIsTrackingLocation(true);
      };

      useEffect(() => () => {
        if (gpsWatchIdRef.current !== null && navigator.geolocation) {
          navigator.geolocation.clearWatch(gpsWatchIdRef.current);
        }
      }, []);

      const handleSimulateWalkingStep = () => {
        const steps = [
          { siteId: 'calle-dei-fuseri', lat: 45.4356, lng: 12.3355, label: "Calle dei Fuseri", distance: '18m ahead', alertTitle: "Passing Tassini Street Origin & 1440 Guild Plaque!", alertBody: "Entering Calle dei Fuseri. Fontanella Campo San Luca is 42m away." },
          { siteId: 'rialto-bridge', lat: 45.4379, lng: 12.3358, label: "Rialto Bridge Approach", distance: '22m ahead', alertTitle: "Approaching Rialto Bridge (Antonio da Ponte, 1591)", alertBody: "Supported by 12,000 elm pilings driven into the Grand Canal's alluvial bank." },
          { siteId: 'ca-rezzonico', lat: 45.4334, lng: 12.3263, label: "Campo San Barnaba", distance: '15m on left', alertTitle: "Proximity Trigger: Ca' Rezzonico & 1575 Plague Altar", alertBody: "Longhena's Baroque palace (Cole Porter's 1920s nightclub) and the 1576 altar are within 60m!" },
          { siteId: 'peggy-guggenheim', lat: 45.4308, lng: 12.3318, label: "Dorsoduro Museum Mile", distance: '25m ahead', alertTitle: "Approaching Palazzo Venier dei Leoni (Peggy Guggenheim)", alertBody: "Known as the 'Palazzo Non Finito' because only its ground floor was built in 1749." }
        ];
        const next = wanderStepIndex % steps.length;
        setWanderStepIndex(next);
        const step = steps[next];
        setUserGpsPos({ lat: step.lat, lng: step.lng, label: step.label });
        setProximityAlert(step);
        const m = VENICE_SITES.find((s) => s.id === step.siteId);
        if (m) selectSite(m);
      };

      const handleExportGeoJSON = async () => {
        try {
          const response = await fetch('/api/geojson');
          if (!response.ok) throw new Error(`GeoJSON export failed (${response.status}).`);
          const geojson = await response.json();
          const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/geo+json" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = "ancient_venice_sites.geojson";
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (error) {
          setMapStatusText(error.message || "Could not export the site dataset.");
        }
      };

      const dataCatalogRecords = useMemo(() => {
        const collections = [
          { label: 'Venice Landmarks', records: VENICE_SITES },
          { label: 'Venetian Churches', records: VENETIAN_CHURCHES },
          { label: 'Confraternities & Guilds', records: VENETIAN_CONFRATERNITIES },
          { label: 'Doges & Dynasties', records: VENETIAN_DOGES },
          { label: 'Inscriptions & Street Altars', records: VENETIAN_INSCRIPTIONS },
          { label: 'Tassini Heritage', records: VENETIAN_TASSINI_HERITAGE },
          { label: 'Today in Venice History Timeline', records: historyTimeline }
        ];
        return collections.flatMap((collection) => collection.records.map((record) => {
          const title = record.name || record.headline || 'Untitled record';
          const yearLabel = record.year !== undefined
            ? String(record.year)
            : record.dateConstructed || record.yearFounded || '';
          const description = record.description || record.text || record.narrativeScript
            || record.historicalContext || record.contributionToHistory || '';
          return {
            id: `${collection.label}:${record.id}`,
            collection: collection.label,
            record,
            title,
            yearLabel,
            place: record.sestiere || record.district || record.location || '',
            category: record.category || record.artifactCategory || record.inscriptionType || '',
            summary: getExhibitBrief({ description }),
            searchText: [collection.label, ...Object.values(record)]
              .filter((value) => typeof value === 'string' || typeof value === 'number')
              .join(' ')
              .toLowerCase(),
            yearRangeRecord: record.year !== undefined
              ? { dateConstructed: String(record.year) }
              : record
          };
        }));
      }, [dataReady, historyTimeline]);

      const dataYearRangeInvalid = dataYearFrom !== '' && dataYearTo !== ''
        && Number(dataYearFrom) > Number(dataYearTo);
      const dataYearIndex = useMemo(() => dataCatalogRecords.flatMap((entry) => {
        const range = getConstructionYearRange(entry.yearRangeRecord);
        return range
          ? [{ entry, start: range.start, end: range.end, year: Math.round((range.start + range.end) / 2) }]
          : [];
      }), [dataCatalogRecords]);
      const dataYearDomain = useMemo(() => {
        const min = dataYearIndex.length
          ? Math.min(...dataYearIndex.map((item) => item.start))
          : 0;
        const max = dataYearIndex.length
          ? Math.max(...dataYearIndex.map((item) => item.end))
          : CURRENT_YEAR;
        return { min, max: Math.max(min + 1, max) };
      }, [dataYearIndex]);
      const dataYearHistogram = useMemo(() => {
        const query = searchQuery.trim().toLowerCase();
        const matchingYears = dataYearIndex.filter(({ entry }) => (
          (dataCollectionFilter === 'All' || entry.collection === dataCollectionFilter)
          && entry.searchText.includes(query)
        ));
        const span = dataYearDomain.max - dataYearDomain.min + 1;
        const binCount = Math.min(60, Math.max(18, Math.ceil(span / 25)));
        const binWidth = span / binCount;
        const bins = Array.from({ length: binCount }, (_, index) => {
          const start = Math.floor(dataYearDomain.min + index * binWidth);
          const end = Math.floor(dataYearDomain.min + (index + 1) * binWidth - 1);
          return { start, end: Math.max(start, end), count: 0 };
        });
        matchingYears.forEach(({ year }) => {
          const index = Math.min(binCount - 1, Math.floor((year - dataYearDomain.min) / binWidth));
          bins[index].count += 1;
        });
        return bins;
      }, [dataYearIndex, dataYearDomain, dataCollectionFilter, searchQuery]);
      const dataYearHistogramMax = Math.max(1, ...dataYearHistogram.map((bin) => bin.count));
      const sliderYearFrom = dataYearFrom === ''
        ? dataYearDomain.min
        : Math.max(dataYearDomain.min, Math.min(dataYearDomain.max, Number(dataYearFrom)));
      const sliderYearTo = dataYearTo === ''
        ? dataYearDomain.max
        : Math.max(sliderYearFrom, Math.max(dataYearDomain.min, Math.min(dataYearDomain.max, Number(dataYearTo))));
      const sliderYearSpan = dataYearDomain.max - dataYearDomain.min;
      const sliderYearLeft = ((sliderYearFrom - dataYearDomain.min) / sliderYearSpan) * 100;
      const sliderYearWidth = ((sliderYearTo - sliderYearFrom) / sliderYearSpan) * 100;
      const filteredDataRecords = useMemo(() => {
        if (dataYearRangeInvalid) return [];
        const query = searchQuery.trim().toLowerCase();
        const records = dataCatalogRecords.filter((entry) => (
          (dataCollectionFilter === 'All' || entry.collection === dataCollectionFilter)
          && entry.searchText.includes(query)
          && matchesConstructionYearRange(entry.yearRangeRecord, dataYearFrom, dataYearTo)
        ));
        return dataCollectionFilter === 'Today in Venice History Timeline'
          ? records.sort((first, second) => first.record.year - second.record.year)
          : records;
      }, [dataCatalogRecords, dataCollectionFilter, dataYearFrom, dataYearTo, dataYearRangeInvalid, searchQuery]);

      useEffect(() => {
        setDataVisibleCount(100);
      }, [searchQuery, dataCollectionFilter, dataYearFrom, dataYearTo]);

      const updateDataYearBound = (bound, year) => {
        if (bound === 'from') {
          setDataYearFrom(String(Math.min(year, sliderYearTo)));
        } else {
          setDataYearTo(String(Math.max(year, sliderYearFrom)));
        }
      };
      const updateDataYearBoundFromPointer = (event, bound) => {
        const track = event.currentTarget.parentElement.getBoundingClientRect();
        const progress = Math.max(0, Math.min(1, (event.clientX - track.left) / track.width));
        updateDataYearBound(bound, Math.round(dataYearDomain.min + progress * sliderYearSpan));
      };
      const handleDataYearSliderKeyDown = (event, bound) => {
        const currentYear = bound === 'from' ? sliderYearFrom : sliderYearTo;
        const lowerLimit = bound === 'from' ? dataYearDomain.min : sliderYearFrom;
        const upperLimit = bound === 'from' ? sliderYearTo : dataYearDomain.max;
        const step = event.shiftKey ? 10 : 1;
        let nextYear = currentYear;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') nextYear -= step;
        else if (event.key === 'ArrowRight' || event.key === 'ArrowUp') nextYear += step;
        else if (event.key === 'Home') nextYear = lowerLimit;
        else if (event.key === 'End') nextYear = upperLimit;
        else return;
        event.preventDefault();
        updateDataYearBound(bound, Math.max(lowerLimit, Math.min(upperLimit, nextYear)));
      };

      if (dataLoadError) {
        return (
          <main className="min-h-screen flex flex-col items-center justify-center gap-4 p-6 text-center">
            <h1 className="text-xl font-bold">Could not load the Venice guide</h1>
            <p role="alert">{dataLoadError}</p>
            <p>Start the Python server with <code>python server.py</code>, then open <code>http://127.0.0.1:8000</code>.</p>
            <button onClick={() => setDataLoadAttempt((attempt) => attempt + 1)} className="rounded-lg bg-[#0F2C36] px-4 py-2 font-semibold text-white">Try again</button>
          </main>
        );
      }
      if (!dataReady) {
        return <main className="min-h-screen flex items-center justify-center p-6"><p role="status">Loading the Data catalog...</p></main>;
      }

      return (
        <div
          className={`app-shell h-screen w-full flex flex-col overflow-hidden ${highContrast ? 'bg-slate-950 text-white' : 'bg-[#F9F6F0] text-[#1A252C]'}`}
          onPointerMove={(event) => {
            document.documentElement.style.setProperty('--pointer-x', `${event.clientX}px`);
            document.documentElement.style.setProperty('--pointer-y', `${event.clientY}px`);
          }}
        >
          {/* TOP HEADER */}
          <header className={`topbar z-30 border-b px-3 py-2 flex flex-wrap items-center justify-between gap-2 ${highContrast ? 'bg-slate-900 border-amber-400' : 'bg-[#0F2C36] border-[#1E4654] text-[#F9F6F0] shadow-md'}`}>
            <div className="flex items-center gap-2.5">
              <div className="brand-mark w-10 h-10 rounded-xl bg-[#B84A39] flex items-center justify-center font-bold shadow border border-[#D4AF37]/40">
                <Icon name="map" size={20} />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="hero-title font-bold text-xl tracking-tight">Ancient Venice</h1>
                  <span className="hero-badge text-[10px] uppercase font-semibold px-2.5 py-1 rounded-full bg-[#D4AF37]/20 text-[#D4AF37] border border-[#D4AF37]/40">Venice field guide</span>
                </div>
                <p className="text-[10px] text-slate-300 hidden sm:block">WPI Venice Project Center • Historical & Archaeological Navigator</p>
              </div>
            </div>

            {/* MODE TABS */}
            <nav className="flex items-center bg-[#091D24] p-1 rounded-xl border border-slate-700/70 gap-1 overflow-x-auto">
              {[
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'route-builder', label: 'Route Builder', icon: 'route' },
                { id: 'street-wander', label: 'Near Me (GPS)', icon: 'gps' },
                { id: 'research-hub', label: 'Data', icon: 'book' }
              ].map((t) => (
                <button
                  key={t.id}
                  onClick={() => {
                    if (t.id === 'route-builder') {
                      openStopPicker();
                    } else {
                      if (t.id === 'research-hub') {
                        setSidebarCollapsed(false);
                        setSelectedSite(null);
                        setSelectedResearchLocation(null);
                        setSelectedChurch(null);
                      }
                      setSelectedDataRecord(null);
                      setActiveMode(t.id);
                    }
                  }}
                  className={`px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap ${activeMode === t.id ? 'bg-[#B84A39] text-white' : 'text-slate-300 hover:text-white'}`}
                >
                  <Icon name={t.icon} size={14} /> <span>{t.label}</span>
                </button>
              ))}
            </nav>

            {/* ROUTE AND ACCESSIBILITY ACTIONS */}
            <div className="flex items-center gap-1.5">
              {activeMode !== 'research-hub' && (
              <a
                href={googleMapsRouteUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-700 hover:bg-emerald-600 text-white border border-emerald-400/40"
              >
                Google Maps <Icon name="arrow" size={14} />
              </a>
              )}
              <button
                onClick={() => setHighContrast(!highContrast)}
                className={`px-2 py-1.5 rounded-lg border text-xs font-semibold ${highContrast ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-200 border-slate-600'}`}
              >
                AA+
              </button>
            </div>
          </header>

          {/* MAIN WORKSPACE */}
          <div className={`flex-1 flex flex-col lg:flex-row relative overflow-hidden ${activeMode === 'home' ? 'hidden' : ''}`}>
            
            {/* LEFT SIDEBAR */}
            <aside
              className={`workspace-sidebar z-20 w-full lg:w-[350px] flex-shrink-0 border-r flex flex-col overflow-y-auto p-3.5 space-y-3.5 max-h-[38vh] lg:max-h-none ${activeMode === 'research-hub' ? 'research-page' : ''} ${sidebarCollapsed ? 'workspace-sidebar--collapsed' : ''} ${highContrast ? 'bg-slate-900 border-amber-400/50' : 'bg-[#F9F6F0] border-[#E2D9C8]'}`}
              style={{ '--sidebar-width': `${panelSizes.sidebarWidth}px`, '--sidebar-height': `${panelSizes.sidebarHeight}px` }}
            >
              {activeMode !== 'research-hub' && <button
                type="button"
                className="sidebar-toggle"
                onClick={() => setSidebarCollapsed((collapsed) => !collapsed)}
                aria-label={sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}
                aria-expanded={!sidebarCollapsed}
                title={sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}
              >
                <Icon name={sidebarCollapsed ? 'panelOpen' : 'panel'} size={17} />
                {!sidebarCollapsed && <span>Collapse panel</span>}
              </button>}
              {!sidebarCollapsed && <div className="sidebar-content">
              {activeMode === 'route-builder' && (
                <>
                  <div className="route-hero p-4 rounded-xl bg-[#0F2C36] text-white border border-[#D4AF37]/30 reveal-on-scroll">
                    <div className="hero-badge-small"><span className="hero-badge-dot" />WPI VENICE PROJECT CENTER</div>
                    <h2 className="route-hero-title">Build Your Venice Walk</h2>
                    <p className="text-xs text-slate-200">Choose 1–5 landmarks, then prioritize themes to personalize their order.</p>
                    <div className="route-metrics">
                      <div className="metric-card">
                        <Icon name="distance" size={16} />
                        <span className="metric-value">{routeStats.distanceKm} km</span>
                        <span className="metric-label">Distance</span>
                      </div>
                      <div className="metric-card">
                        <Icon name="clock" size={16} />
                        <span className="metric-value">~{routeStats.walkMins}m</span>
                        <span className="metric-label">Travel time</span>
                      </div>
                      <div className="metric-card">
                        <Icon name="pin" size={16} />
                        <span className="metric-value">{selectedStopIds.length} / 5</span>
                        <span className="metric-label">Selected stops</span>
                      </div>
                    </div>
                  </div>

                  <div className="selected-stops-card reveal-on-scroll">
                    <div className="selected-stops-heading">
                      <div>
                        <h3>Your locations</h3>
                        <p>{selectedStopIds.length} of 5 stops selected</p>
                      </div>
                      <Icon name="pin" size={18} />
                    </div>
                    {selectedStopIds.length > 0 ? (
                      <ol className="selected-stops-list">
                        {(activeRouteIds.length > 0 ? activeRouteIds : selectedStopIds).map((id, index) => {
                          const site = VENICE_SITES.find((item) => item.id === id);
                          if (!site) return null;
                          return (
                            <li key={site.id}>
                              <span className="selected-stop-number">{index + 1}</span>
                              <span className="selected-stop-name">{site.name}</span>
                              <span className="selected-stop-district">{site.sestiere}</span>
                            </li>
                          );
                        })}
                      </ol>
                    ) : (
                      <p className="selected-stops-empty">No locations selected yet. Choose at least one to build a route.</p>
                    )}
                    <button type="button" onClick={openStopPicker} className="choose-locations-button">
                      Choose or change locations
                    </button>
                  </div>

                  <fieldset className="route-interest-panel">
                    <legend>Interests &amp; nearby finds</legend>
                    <p>Choose collections to prioritize matching route landmarks and nearby finds, then set the construction years to explore. The Data catalog is not filtered by these year preferences.</p>
                    <div className="preference-subgroup">
                      <h4>Prioritize these collections</h4>
                      <div className="route-interest-options">
                        <label>
                          <input
                            type="checkbox"
                            checked={includeChurches}
                            onChange={(event) => handleCollectionPreferenceChange(setIncludeChurches, event.target.checked)}
                            aria-label="Prioritize Venetian Churches and show nearby church records"
                          />
                          <span>Venetian Churches</span>
                        </label>
                        <label>
                          <input
                            type="checkbox"
                            checked={includeConfraternities}
                            onChange={(event) => handleCollectionPreferenceChange(setIncludeConfraternities, event.target.checked)}
                            aria-label="Prioritize Confraternities and Guilds and show nearby records"
                          />
                          <span>Confraternities &amp; Guilds</span>
                        </label>
                        <label>
                          <input
                            type="checkbox"
                            checked={includeDoges}
                            onChange={(event) => handleCollectionPreferenceChange(setIncludeDoges, event.target.checked)}
                            aria-label="Prioritize Doges and Dynasties and show nearby records"
                          />
                          <span>Doges &amp; Dynasties</span>
                        </label>
                        <label>
                          <input
                            type="checkbox"
                            checked={includeInscriptions}
                            onChange={(event) => handleCollectionPreferenceChange(setIncludeInscriptions, event.target.checked)}
                            aria-label="Prioritize Inscriptions and Street Altars and show nearby records"
                          />
                          <span>Inscriptions &amp; Street Altars</span>
                        </label>
                        <label>

                  <p>
                    Ancient Venice is an interactive guide to the city’s historic landmarks and cultural
                    records. Explore the map, build a walk through the places that interest you, and uncover
                    the research behind each location.
                  </p>
                  <div className="home-actions">
                    <button type="button" onClick={openStopPicker} className="home-primary-action">
                      Plan a walking route <Icon name="arrow" size={16} />
                    </button>
                    <button type="button" onClick={() => setActiveMode('research-hub')} className="home-secondary-action">
                      Explore Data
                    </button>
                  </div>
                </div>
                <div className="home-route-preview" aria-hidden="true">
                  <div className="home-route-preview-header">
                    <span>PLAN YOUR VISIT</span>
                    <Icon name="map" size={17} />
                  </div>
                  <div className="home-route-preview-path">
                    <span className="home-route-dot home-route-dot--start">1</span>
                    <span className="home-route-line" />
                    <span className="home-route-dot">2</span>
                    <span className="home-route-line" />
                    <span className="home-route-dot home-route-dot--end">3</span>
                  </div>
                  <div className="home-route-preview-stops">
                    <span>Historic landmarks</span>
                    <span>Walking route</span>
                    <span>Data collections</span>
                  </div>
                  <p>Choose places to visit and explore their stories along the way.</p>
                </div>
              </section>
              <section className="home-features" aria-label="What you can explore">
                <article>
                  <span className="home-feature-number">01</span>
                  <h3>Build your own walk</h3>
                  <p>Choose up to five landmarks, set a starting point, and get a walking route through the city.</p>
                </article>
                <article>
                  <span className="home-feature-number">02</span>
                  <h3>Explore on the map</h3>
                  <p>Select a landmark or research location to open its history, location record, and audio narration.</p>
                </article>
                <article>
                  <span className="home-feature-number">03</span>
                  <h3>Explore the Data</h3>
                  <p>Browse landmarks, churches, guilds, doges, inscriptions, and the Venice history timeline.</p>
                </article>
              </section>
            </main>
          )}

          {showTodayHistoryPopup && activeMode === 'home' && todayHistoryEvent && (
            <div
              className="fixed inset-0 z-[70] flex items-center justify-center bg-[#07171D]/80 p-3 backdrop-blur-sm sm:p-6"
              onMouseDown={(event) => {
                if (event.target === event.currentTarget) setShowTodayHistoryPopup(false);
              }}
            >
              <section
                className="relative flex max-h-[90vh] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-[#D4AF37]/60 bg-[#F9F6F0] text-[#1A252C] shadow-2xl"
                role="dialog"
                aria-modal="true"
                aria-labelledby="today-history-title"
              >
                <header className="flex items-start justify-between gap-4 border-b border-[#D4AF37]/40 bg-[#0F2C36] px-5 py-4 text-white">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-[0.18em] text-[#D4AF37]">Venice through time</span>
                    <h2 id="today-history-title" className="mt-1 text-xl font-bold" style={{ fontFamily: "'Georgia', serif" }}>
                      Today in Venice History
                    </h2>
                    <p className="mt-1 text-xs text-slate-300">{todayHistoryEvent.dateDisplay} · A moment from the past</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowTodayHistoryPopup(false)}
                    className="rounded-lg px-2.5 py-1.5 text-sm text-slate-200 hover:bg-white/10 hover:text-white"
                    aria-label="Close today's history"
                  >
                    ✕
                  </button>
                </header>
                <div className="space-y-3 overflow-y-auto p-4 sm:p-5">
                  <article className="rounded-xl border border-[#E2D9C8] bg-white p-4 shadow-sm">
                    <div className="mb-2 flex flex-wrap items-center gap-2">
                      <span className="rounded-full bg-[#B84A39]/10 px-2.5 py-1 text-xs font-bold text-[#8F382B]">{todayHistoryEvent.year}</span>
                      {todayHistoryEvent.category && <span className="text-[11px] font-semibold text-slate-600">{todayHistoryEvent.category}</span>}
                      {todayHistoryEvent.location && <span className="text-[11px] text-slate-500">· {todayHistoryEvent.location}</span>}
                    </div>
                    <h3 className="text-sm font-bold leading-snug text-[#0F2C36]" style={{ fontFamily: "'Georgia', serif" }}>
                      {todayHistoryEvent.headline}
                    </h3>
                    <p className="mt-2 text-sm leading-relaxed text-slate-700">{todayHistoryEvent.text}</p>
                    {(todayHistoryEvent.citation || todayHistoryEvent.sourceDocument) && (
                      <details className="mt-3 border-t border-[#E2D9C8] pt-2 text-xs text-slate-600">
                        <summary className="cursor-pointer font-semibold text-[#0F2C36]">Source details</summary>
                        {todayHistoryEvent.citation && <p className="mt-2">{todayHistoryEvent.citation}</p>}
                        {todayHistoryEvent.sourceDocument && <p className="mt-1 text-[11px]">{todayHistoryEvent.sourceDocument}</p>}
                      </details>
                    )}
                  </article>
                </div>
                <footer className="border-t border-[#E2D9C8] bg-[#F3EDE0] px-5 py-3 text-right">
                  <button
                    type="button"
                    onClick={() => setShowTodayHistoryPopup(false)}
                    className="rounded-lg bg-[#0F2C36] px-4 py-2 text-xs font-semibold text-white hover:bg-[#194554]"
                  >
                    Continue exploring
                  </button>
                </footer>
              </section>
            </div>
          )}

          {selectedDataRecord && activeMode === 'research-hub' && (
            <div
              className="fixed inset-0 z-[70] flex items-center justify-center bg-[#07171D]/80 p-3 backdrop-blur-sm sm:p-6"
              onMouseDown={(event) => {
                if (event.target === event.currentTarget) setSelectedDataRecord(null);
              }}
            >
              <section
                className="flex max-h-[90vh] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-[#D4AF37]/60 bg-[#F9F6F0] text-[#1A252C] shadow-2xl"
                role="dialog"
                aria-modal="true"
                aria-labelledby="data-record-title"
                onMouseDown={(event) => event.stopPropagation()}
              >
                <header className="flex items-start justify-between gap-4 border-b border-[#D4AF37]/40 bg-[#0F2C36] px-5 py-4 text-white">
                  <div className="min-w-0">
                    <span className="text-[10px] font-bold uppercase tracking-[0.16em] text-[#D4AF37]">{selectedDataRecord.collection}</span>
                    <h2 id="data-record-title" className="mt-1 text-xl font-bold leading-snug" style={{ fontFamily: "'Georgia', serif" }}>
                      {selectedDataRecord.title}
                    </h2>
                    <p className="mt-1 text-xs text-slate-300">
                      {[selectedDataRecord.yearLabel, selectedDataRecord.place].filter(Boolean).join(' · ')}
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setSelectedDataRecord(null)}
                    className="rounded-lg px-2.5 py-1.5 text-sm text-slate-200 hover:bg-white/10 hover:text-white"
                    aria-label="Close data record"
                  >
                    ✕
                  </button>
                </header>
                <div className="space-y-4 overflow-y-auto p-4 sm:p-5">
                  {selectedDataRecord.collection !== 'Today in Venice History Timeline' && (
                    <ExhibitLabel record={selectedDataRecord.record} showTitle={false} />
                  )}
                  {selectedDataRecord.record.text && (
                    <section className="rounded-xl border border-[#E2D9C8] bg-white p-4">
                      <h3 className="text-xs font-bold uppercase text-[#B84A39]">Historical account</h3>
                      <p className="mt-2 text-sm leading-relaxed text-slate-700">{selectedDataRecord.record.text}</p>
                    </section>
                  )}
                  <details className="rounded-xl border border-[#E2D9C8] bg-white p-4">
                    <summary className="cursor-pointer text-sm font-semibold text-[#0F2C36]">More record details</summary>
                    <div className="mt-3 space-y-3 text-sm leading-relaxed text-slate-700">
                      {selectedDataRecord.record.description && (
                        <p><strong>Description:</strong> {selectedDataRecord.record.description}</p>
                      )}
                      {selectedDataRecord.record.historicalContext && (
                        <p><strong>Historical context:</strong> {selectedDataRecord.record.historicalContext}</p>
                      )}
                      {selectedDataRecord.record.narrativeScript && (
                        <p><strong>Narrative:</strong> {selectedDataRecord.record.narrativeScript}</p>
                      )}
                      {selectedDataRecord.record.contributionToHistory && (
                        <p><strong>Contribution to history:</strong> {selectedDataRecord.record.contributionToHistory}</p>
                      )}
                      {selectedDataRecord.record.routeConnection && (
                        <p><strong>Route connection:</strong> {selectedDataRecord.record.routeConnection}</p>
                      )}
                      {selectedDataRecord.record.funFactlet && (
                        <p><strong>Did you know?</strong> {selectedDataRecord.record.funFactlet}</p>
                      )}
                      {selectedDataRecord.record.tassiniNote && (
                        <p><strong>Tassini note:</strong> {selectedDataRecord.record.tassiniNote}</p>
                      )}
                      {selectedDataRecord.record.address && (
                        <p><strong>Address:</strong> {selectedDataRecord.record.address}</p>
                      )}
                      {selectedDataRecord.record.island && (
                        <p><strong>Island:</strong> {selectedDataRecord.record.island}</p>
                      )}
                      {selectedDataRecord.record.originalText && (
                        <p><strong>Original inscription:</strong> {selectedDataRecord.record.originalText}</p>
                      )}
                      {selectedDataRecord.record.englishTranslation && (
                        <p><strong>English translation:</strong> {selectedDataRecord.record.englishTranslation}</p>
                      )}
                      {selectedDataRecord.record.italianTranslation && (
                        <p><strong>Italian translation:</strong> {selectedDataRecord.record.italianTranslation}</p>
                      )}
                      {selectedDataRecord.record.conditionNotes && (
                        <p><strong>Condition:</strong> {selectedDataRecord.record.conditionNotes}</p>
                      )}
                      {selectedDataRecord.record.tassiniQuotation && (
                        <p><strong>Tassini quotation:</strong> {selectedDataRecord.record.tassiniQuotation}</p>
                      )}
                      {selectedDataRecord.record.englishToponymicAnalysis && (
                        <p><strong>Translation &amp; toponymic analysis:</strong> {selectedDataRecord.record.englishToponymicAnalysis}</p>
                      )}
                      {(selectedDataRecord.record.citation || selectedDataRecord.record.tassiniCitation
                        || selectedDataRecord.record.sourceDocument) && (
                        <div className="border-t border-[#E2D9C8] pt-3 text-xs">
                          <h3 className="font-bold uppercase text-[#0F2C36]">Sources</h3>
                          {selectedDataRecord.record.citation && <p className="mt-1">{selectedDataRecord.record.citation}</p>}
                          {selectedDataRecord.record.tassiniCitation && <p className="mt-1">{selectedDataRecord.record.tassiniCitation}</p>}
                          {selectedDataRecord.record.sourceDocument && <p className="mt-1">{selectedDataRecord.record.sourceDocument}</p>}
                        </div>
                      )}
                    </div>
                  </details>
                </div>
                <footer className="border-t border-[#E2D9C8] bg-[#F3EDE0] px-5 py-3 text-right">
                  <button
                    type="button"
                    onClick={() => setSelectedDataRecord(null)}
                    className="rounded-lg bg-[#0F2C36] px-4 py-2 text-xs font-semibold text-white hover:bg-[#194554]"
                  >
                    Back to Data
                  </button>
                </footer>
              </section>
            </div>
          )}

          {showStopPicker && activeMode === 'route-builder' && (
            <div
              className="stop-picker-backdrop"
              onMouseDown={(event) => {
                if (event.target === event.currentTarget) closeStopPicker();
              }}
            >
              <section
                className="stop-picker-dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="stop-picker-title"
                onMouseDown={(event) => event.stopPropagation()}
              >
                <header className="stop-picker-header">
                  <div>
                    <span>ROUTE BUILDER</span>
                    <h2 id="stop-picker-title">Choose your locations</h2>
                    <p>Select 1–5 landmarks for your walk. You can change them whenever you like.</p>
                  </div>
                  <button type="button" onClick={closeStopPicker} aria-label="Close location chooser">✕</button>
                </header>
                <div className="stop-picker-list">
                  {VENICE_SITES
                    .filter((site) => site.type !== 'submerged'
                      && isWithinBuiltYearRange(site)
                      && (useBoats || !site.requiresBoat || draftStopIds.includes(site.id)))
                    .map((site) => {
                    const isSelected = draftStopIds.includes(site.id);
                    const requiresUnavailableBoat = !useBoats && site.requiresBoat;
                    const isUnavailable = accessibleOnly && !site.accessibleStepFree;
                    const cannotAddMore = !isSelected && draftStopIds.length >= 5;
                    return (
                      <label key={site.id} className={`stop-picker-option ${isSelected ? 'stop-picker-option--selected' : ''} ${isUnavailable || cannotAddMore || requiresUnavailableBoat ? 'stop-picker-option--disabled' : ''}`}>
                        <input
                          type="checkbox"
                          checked={isSelected}
                          disabled={isUnavailable || cannotAddMore || requiresUnavailableBoat}
                          onChange={() => setDraftStopIds((current) => (
                            isSelected
                              ? current.filter((id) => id !== site.id)
                              : [...current, site.id]
                          ))}
                        />
                        <span className="stop-picker-number">{isSelected ? draftStopIds.indexOf(site.id) + 1 : '＋'}</span>
                        <span className="stop-picker-location">
                          <span>{site.name}</span>
                          <small>{requiresUnavailableBoat ? 'Boat required · deselect to remove' : `${site.sestiere} · ${site.accessibleStepFree ? 'Step-free access' : 'Steps'}`}</small>
                        </span>
                      </label>
                    );
                  })}
                </div>
                <footer className="stop-picker-footer">
                  <span aria-live="polite">
                    {!useBoats && draftStopIds.some((id) => VENICE_SITES.find((item) => item.id === id)?.requiresBoat)
                      ? 'Deselect landmarks that require a boat to continue'
                      : draftStopIds.length === 5
                        ? '5 of 5 selected · deselect one to change'
                        : `${draftStopIds.length} of 5 locations selected`}
                  </span>
                  <div>
                    <button type="button" onClick={closeStopPicker} className="stop-picker-cancel">Cancel</button>
                    <button
                      type="button"
                      onClick={applyStopSelection}
                      disabled={draftStopIds.length < 1 || builtYearRangeInvalid || (!useBoats && draftStopIds.some((id) => VENICE_SITES.find((item) => item.id === id)?.requiresBoat))}
                      className="stop-picker-apply"
                    >
                      Use these locations
                    </button>
                  </div>
                </footer>
              </section>
            </div>
          )}

          {/* EMBEDDED GOOGLE MAPS MODAL */}
          {showGoogleEmbedModal && selectedSite && !selectedResearchLocation && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-[#F9F6F0] text-[#1A252C] max-w-2xl w-full rounded-2xl shadow-2xl border border-[#D4AF37] overflow-hidden flex flex-col">
                <div className="p-3.5 bg-[#0F2C36] text-white flex justify-between items-center">
                  <div>
                    <h3 className="font-bold text-sm">Google Maps Live View: {selectedSite.name}</h3>
                    <p className="text-[11px] text-slate-300">{selectedSite.lat}° N, {selectedSite.lng}° E ({selectedSite.sestiere})</p>
                  </div>
                  <button onClick={() => setShowGoogleEmbedModal(false)} className="px-2.5 py-1 rounded bg-white/10 text-white text-xs">✕ Close</button>
                </div>
                <div className="w-full h-[380px] bg-slate-200">
                  <iframe
                    title="Google Maps View"
                    width="100%"
                    height="100%"
                    style={{ border: 0 }}
                    loading="lazy"
                    allowFullScreen
                    src={`https://maps.google.com/maps?q=${selectedSite.lat},${selectedSite.lng}&z=18&output=embed`}
                  />
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
