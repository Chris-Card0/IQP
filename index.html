<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ancient Venice | WPI Historical & Archaeological Navigator</title>
  <meta name="description" content="Explore Venice's historic landmarks, build themed walking routes, and browse WPI research records." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-[#F9F6F0] text-[#1A252C]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const ICON_PATHS = {
      route: ['M3 3v18h18', 'm19 9-5 5-4-4-3 3', 'M19 3h.01'],
      gps: ['M12 2v2', 'M12 20v2', 'm4.93 4.93 1.42 1.42', 'm17.65 17.65 1.42 1.42', 'M2 12h2', 'M20 12h2', 'm6.35 17.65-1.42 1.42', 'm19.07 4.93-1.42 1.42', 'M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z'],
      map: ['M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z', 'M9 3v15', 'M15 6v15'],
      book: ['M4 19.5A2.5 2.5 0 0 1 6.5 17H20', 'M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z'],
      arrow: ['M7 17 17 7', 'M7 7h10v10'],
      accessibility: ['M12 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z', 'M4 7h16', 'M12 7v5', 'm8 21 4-9 4 9', 'm7 7 2 5h6l2-5'],
      distance: ['M3 16.5a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0Z', 'M16 7.5a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0Z', 'm8 16 8-7'],
      clock: ['M12 8v4l3 3', 'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z'],
      pin: ['M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z', 'M12 10a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z'],
      panel: ['M3 3h18v18H3z', 'M9 3v18', 'm15 10-2 2 2 2'],
      panelOpen: ['M3 3h18v18H3z', 'M9 3v18', 'm13 10 2 2-2 2'],
      download: ['M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4', 'm7 10 5 5 5-5', 'M12 15V3'],
      search: ['m21 21-4.34-4.34', 'M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z']
    };

    function Icon({ name, size = 16, className = '' }) {
      return (
        <svg
          aria-hidden="true"
          className={className}
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="1.8"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          {(ICON_PATHS[name] || []).map((path, index) => <path key={index} d={path} />)}
        </svg>
      );
    }

    // Haversine Real-World Distance Calculator (Meters)
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const toRad = (d) => (d * Math.PI) / 180;
      const a =
        Math.sin(toRad(lat2 - lat1) / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(toRad(lon2 - lon1) / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // Complete Dataset combining Tour Information + WPI IQPs + GNA
    let VENICE_SITES = [];
    let DRINKING_FOUNTAINS = [];
    let VENETIAN_CHURCHES = [];
    let VENETIAN_CONFRATERNITIES = [];
    let VENETIAN_DOGES = [];
    let VENETIAN_INSCRIPTIONS = [];

    const PRESET_ROUTES = [
      { id: 'palaces', title: "Aristocratic Palaces to Public Museums", duration: "Santa Croce & Dorsoduro walk", stops: ['ca-pesaro', 'natural-history-fondaco', 'scuola-san-giovanni', 'ca-rezzonico', 'peggy-guggenheim'] },
      { id: 'plague', title: "Plague, Quarantines & Votive Architecture", duration: "San Marco & Dorsoduro walk", stops: ['st-marks-basilica', 'salute-plague-votive', 'campo-san-barnaba-altar', 'peggy-guggenheim'] },
      { id: 'guilds', title: "Medieval Guilds & Venetian Commerce", duration: "San Polo & Santa Croce walk", stops: ['rialto-bridge', 'calle-dei-fuseri', 'scuola-san-giovanni', 'ca-pesaro'] }
    ];

    function App() {
      const [dataReady, setDataReady] = useState(false);
      const [dataLoadError, setDataLoadError] = useState('');
      const [dataLoadAttempt, setDataLoadAttempt] = useState(0);
      const [activeMode, setActiveMode] = useState('route-builder');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [panelSizes, setPanelSizes] = useState({
        sidebarWidth: 350,
        researchWidth: 390,
        sidebarHeight: 320,
        researchHeight: 380
      });
      const [compactLayout, setCompactLayout] = useState(() => window.matchMedia('(max-width: 1023px)').matches);
      const [googleMapTileStyle, setGoogleMapTileStyle] = useState('roadmap');
      const [selectedStopIds, setSelectedStopIds] = useState(['st-marks-basilica', 'calle-dei-fuseri', 'rialto-bridge', 'ca-rezzonico', 'peggy-guggenheim']);
      const [includeChurches, setIncludeChurches] = useState(false);
      const [includeConfraternities, setIncludeConfraternities] = useState(false);
      const [includeDoges, setIncludeDoges] = useState(false);
      const [includeInscriptions, setIncludeInscriptions] = useState(false);
      const [showAllChurches, setShowAllChurches] = useState(false);
      const [showAllConfraternities, setShowAllConfraternities] = useState(false);
      const [showAllDoges, setShowAllDoges] = useState(false);
      const [showAllInscriptions, setShowAllInscriptions] = useState(false);
      const [accessibleOnly, setAccessibleOnly] = useState(false);
      const [routeStartFromLocation, setRouteStartFromLocation] = useState(false);
      const [routeStartLocation, setRouteStartLocation] = useState(null);
      const [activeRouteIds, setActiveRouteIds] = useState([]);
      const [routeLegs, setRouteLegs] = useState([]);
      const [routeSummary, setRouteSummary] = useState(null);
      const [isBuildingRoute, setIsBuildingRoute] = useState(false);
      const [mapStatusText, setMapStatusText] = useState('Loading Venice research data...');

      const [searchQuery, setSearchQuery] = useState('');
      const [sestiereFilter, setSestiereFilter] = useState('All');
      const [showFountains, setShowFountains] = useState(true);
      const [showSubmergedProtected, setShowSubmergedProtected] = useState(true);
      const [selectedSite, setSelectedSite] = useState(null);
      const [selectedChurch, setSelectedChurch] = useState(null);
      const [selectedResearchLocation, setSelectedResearchLocation] = useState(null);
      const [showGoogleEmbedModal, setShowGoogleEmbedModal] = useState(false);
      const [highContrast, setHighContrast] = useState(false);

      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [audioProgress, setAudioProgress] = useState(0);
      const [userGpsPos, setUserGpsPos] = useState({ lat: 45.4352, lng: 12.3352, label: "Campo San Luca (Virtual Walker)" });
      const [isTrackingLocation, setIsTrackingLocation] = useState(false);
      const [isDemoLocation, setIsDemoLocation] = useState(true);
      const [scanRadiusMeters, setScanRadiusMeters] = useState(50);
      const [wanderStepIndex, setWanderStepIndex] = useState(0);
      const [proximityAlert, setProximityAlert] = useState(null);

      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const leafletLayerGroupRef = useRef(null);
      const leafletTileLayerRef = useRef(null);
      const gpsWatchIdRef = useRef(null);
      const routeRequestIdRef = useRef(0);
      const resizeStartRef = useRef(null);

      useEffect(() => {
        const updateLayout = () => setCompactLayout(window.matchMedia('(max-width: 1023px)').matches);
        window.addEventListener('resize', updateLayout);
        return () => window.removeEventListener('resize', updateLayout);
      }, []);

      const beginPanelResize = (panel, event) => {
        event.preventDefault();
        event.currentTarget.setPointerCapture(event.pointerId);
        resizeStartRef.current = {
          panel,
          axis: window.matchMedia('(max-width: 1023px)').matches ? 'y' : 'x',
          x: event.clientX,
          y: event.clientY,
          ...panelSizes
        };
      };

      const movePanelResize = (event) => {
        const start = resizeStartRef.current;
        if (!start) return;
        const delta = start.axis === 'x' ? event.clientX - start.x : event.clientY - start.y;
        setPanelSizes((current) => {
          if (start.panel === 'sidebar') {
            const size = start.axis === 'x' ? 'sidebarWidth' : 'sidebarHeight';
            const min = start.axis === 'x' ? 250 : 180;
            const max = start.axis === 'x' ? Math.min(520, window.innerWidth * 0.48) : Math.min(520, window.innerHeight * 0.7);
            return { ...current, [size]: Math.round(Math.max(min, Math.min(max, start[size] + delta))) };
          }
          const size = start.axis === 'x' ? 'researchWidth' : 'researchHeight';
          const min = start.axis === 'x' ? 300 : 180;
          const max = start.axis === 'x' ? Math.min(520, window.innerWidth * 0.48) : Math.min(520, window.innerHeight * 0.7);
          return { ...current, [size]: Math.round(Math.max(min, Math.min(max, start[size] - delta))) };
        });
      };

      const stopPanelResize = () => {
        resizeStartRef.current = null;
      };

      const handlePanelResizeKeyDown = (panel, event) => {
        const horizontal = window.matchMedia('(max-width: 1023px)').matches;
        const amount = event.shiftKey ? 40 : 16;
        const key = horizontal
          ? (event.key === 'ArrowDown' ? 'increase' : event.key === 'ArrowUp' ? 'decrease' : null)
          : (event.key === 'ArrowRight' ? 'increase' : event.key === 'ArrowLeft' ? 'decrease' : null);
        if (!key) return;
        event.preventDefault();
        const direction = key === 'increase' ? 1 : -1;
        setPanelSizes((current) => {
          const size = panel === 'sidebar'
            ? (horizontal ? 'sidebarHeight' : 'sidebarWidth')
            : (horizontal ? 'researchHeight' : 'researchWidth');
          const min = horizontal ? 180 : panel === 'sidebar' ? 250 : 300;
          const max = horizontal
            ? Math.min(520, window.innerHeight * 0.7)
            : Math.min(520, window.innerWidth * 0.48);
          const panelDirection = panel === 'sidebar' ? direction : -direction;
          return { ...current, [size]: Math.round(Math.max(min, Math.min(max, current[size] + amount * panelDirection))) };
        });
      };

      useEffect(() => {
        let cancelled = false;
        Promise.all([
          fetch('/api/sites').then(async (response) => {
            if (!response.ok) throw new Error(`Landmark data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/fountains').then(async (response) => {
            if (!response.ok) throw new Error(`Fountain data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/churches').then(async (response) => {
            if (!response.ok) throw new Error(`Church data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/confraternities').then(async (response) => {
            if (!response.ok) throw new Error(`Confraternity data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/doges').then(async (response) => {
            if (!response.ok) throw new Error(`Doge and dynasty data request failed (${response.status}).`);
            return response.json();
          }),
          fetch('/api/inscriptions').then(async (response) => {
            if (!response.ok) throw new Error(`Inscription data request failed (${response.status}).`);
            return response.json();
          })
        ]).then(([sites, fountains, churches, confraternities, doges, inscriptions]) => {
          if (!Array.isArray(sites) || !Array.isArray(fountains) || !Array.isArray(churches)
            || !Array.isArray(confraternities) || !Array.isArray(doges) || !Array.isArray(inscriptions)
            || sites.length === 0 || churches.length === 0 || confraternities.length === 0
            || doges.length === 0 || inscriptions.length === 0) {
            throw new Error("The server returned an invalid or empty Venice dataset.");
          }
          if (cancelled) return;
          VENICE_SITES = sites;
          DRINKING_FOUNTAINS = fountains;
          VENETIAN_CHURCHES = churches;
          VENETIAN_CONFRATERNITIES = confraternities;
          VENETIAN_DOGES = doges;
          VENETIAN_INSCRIPTIONS = inscriptions;
          setSelectedSite(sites[0]);
          setMapStatusText(`${sites.length} landmarks, ${churches.length} churches, ${confraternities.length} confraternities & guilds, ${doges.length} doge locations, ${inscriptions.length} inscriptions & street altars, ${fountains.length} fountains`);
          setDataReady(true);
          setDataLoadError('');
        }).catch((error) => {
          if (cancelled) return;
          setDataLoadError(error.message || "Could not load Venice research data.");
        });
        return () => { cancelled = true; };
      }, [dataLoadAttempt]);

      const activeRouteSites = useMemo(() => activeRouteIds.map((id) => VENICE_SITES.find((s) => s.id === id)).filter(Boolean), [activeRouteIds]);

      useEffect(() => {
        const timer = window.setTimeout(() => leafletMapRef.current?.invalidateSize(), 280);
        return () => window.clearTimeout(timer);
      }, [sidebarCollapsed]);

      useEffect(() => {
        const revealItems = document.querySelectorAll('.reveal-on-scroll:not(.is-visible)');
        if (!('IntersectionObserver' in window)) {
          revealItems.forEach((item) => item.classList.add('is-visible'));
          return undefined;
        }
        const itemsByRoot = new Map();
        revealItems.forEach((item) => {
          const root = item.closest('.workspace-sidebar, .research-drawer');
          if (!itemsByRoot.has(root)) itemsByRoot.set(root, []);
          itemsByRoot.get(root).push(item);
        });
        const observers = [];
        itemsByRoot.forEach((items, root) => {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
              }
            });
          }, { root, threshold: 0.08 });
          items.forEach((item) => observer.observe(item));
          observers.push(observer);
        });
        return () => observers.forEach((observer) => observer.disconnect());
      }, [activeMode, selectedSite, dataReady, sidebarCollapsed]);

      const routeStats = useMemo(() => {
        return {
          distanceKm: routeSummary ? routeSummary.distanceKm.toFixed(2) : '—',
          walkMins: routeSummary ? routeSummary.durationMinutes : '—',
          stepFreeCount: activeRouteSites.filter((site) => site.accessibleStepFree).length
        };
      }, [activeRouteSites, routeSummary]);

      const nearbyFeatures = useMemo(() => {
        const sites = VENICE_SITES
          .filter((site) => site.type !== 'submerged' && !activeRouteIds.includes(site.id))
          .map((site) => ({ ...site, distanceMeters: getDistanceMeters(userGpsPos.lat, userGpsPos.lng, site.lat, site.lng) }))
          .filter((site) => site.distanceMeters <= scanRadiusMeters)
          .sort((a, b) => a.distanceMeters - b.distanceMeters);
        const churches = includeChurches
          ? VENETIAN_CHURCHES
            .map((church) => ({ ...church, distanceMeters: getDistanceMeters(userGpsPos.lat, userGpsPos.lng, church.lat, church.lng) }))
            .filter((church) => church.distanceMeters <= scanRadiusMeters)
            .sort((a, b) => a.distanceMeters - b.distanceMeters)
          : [];
        const getNearbyLocations = (locations, enabled) => enabled
            ? locations
              .map((location) => ({ ...location, distanceMeters: getDistanceMeters(userGpsPos.lat, userGpsPos.lng, location.lat, location.lng) }))
              .filter((location) => location.distanceMeters <= scanRadiusMeters)
              .sort((a, b) => a.distanceMeters - b.distanceMeters)
            : [];
        const confraternities = getNearbyLocations(VENETIAN_CONFRATERNITIES, includeConfraternities);
        const doges = getNearbyLocations(VENETIAN_DOGES, includeDoges);
        const inscriptions = getNearbyLocations(VENETIAN_INSCRIPTIONS, includeInscriptions);
        const fountains = DRINKING_FOUNTAINS.map((f) => ({ ...f, distanceMeters: getDistanceMeters(userGpsPos.lat, userGpsPos.lng, f.lat, f.lng) })).filter((f) => f.distanceMeters <= scanRadiusMeters).sort((a, b) => a.distanceMeters - b.distanceMeters);
        return { sites, churches, confraternities, doges, inscriptions, fountains };
      }, [userGpsPos, scanRadiusMeters, activeRouteIds, includeChurches, includeConfraternities, includeDoges, includeInscriptions]);
      const closestPreferredArtifact = nearbyFeatures.sites.find((site) => site.distanceMeters <= scanRadiusMeters);
      const closestPreferredChurch = nearbyFeatures.churches[0];
      const closestPreferredInscription = nearbyFeatures.inscriptions[0];
      const selectResearchLocation = (location, collectionLabel) => {
        setSelectedChurch(collectionLabel === 'Venetian Church' ? location : null);
        setSelectedResearchLocation({ ...location, collectionLabel });
        leafletMapRef.current?.setView([location.lat, location.lng], 16);
      };
      const selectSite = (site) => {
        setSelectedResearchLocation(null);
        setSelectedChurch(null);
        setSelectedSite(site);
      };

      const googleMapsRouteUrl = useMemo(() => {
        if (activeRouteSites.length === 0) return 'https://www.google.com/maps/place/Venice,+Italy';
        const startsFromCurrentLocation = routeStartFromLocation && routeStartLocation;
        const origin = startsFromCurrentLocation
          ? `${routeStartLocation.lat},${routeStartLocation.lng}`
          : `${activeRouteSites[0].lat},${activeRouteSites[0].lng}`;
        const dest = `${activeRouteSites[activeRouteSites.length - 1].lat},${activeRouteSites[activeRouteSites.length - 1].lng}`;
        const waypoints = startsFromCurrentLocation
          ? activeRouteSites.slice(0, -1)
          : activeRouteSites.slice(1, -1);
        const wps = waypoints.map((s) => `${s.lat},${s.lng}`).join('|');
        return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}${wps ? `&waypoints=${encodeURIComponent(wps)}` : ''}&travelmode=walking`;
      }, [activeRouteSites, routeStartFromLocation, routeStartLocation]);

      // Initialize Leaflet with public basemap providers.
      useEffect(() => {
        if (!mapContainerRef.current || !window.L || !dataReady) return;
        const L = window.L;
        if (!leafletMapRef.current) {
          const map = L.map(mapContainerRef.current, { center: [45.4355, 12.3335], zoom: 14, zoomControl: false });
          L.control.zoom({ position: 'bottomright' }).addTo(map);
          leafletMapRef.current = map;
          leafletLayerGroupRef.current = L.layerGroup().addTo(map);
        }
        if (leafletTileLayerRef.current) leafletMapRef.current.removeLayer(leafletTileLayerRef.current);

        let tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        let attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
        if (googleMapTileStyle === 'satellite') {
          tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
          attribution = 'Tiles &copy; Esri';
        }
        if (googleMapTileStyle === 'vintage') {
          tileUrl = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
          attribution = '&copy; OpenStreetMap contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
        }

        leafletTileLayerRef.current = L.tileLayer(tileUrl, { maxZoom: 19, attribution }).addTo(leafletMapRef.current);
        setTimeout(() => leafletMapRef.current?.invalidateSize(), 150);
      }, [googleMapTileStyle, dataReady]);

      // Render Map Layers
      useEffect(() => {
        if (!leafletMapRef.current || !leafletLayerGroupRef.current || !window.L || !dataReady) return;
        const L = window.L;
        const group = leafletLayerGroupRef.current;
        group.clearLayers();

        routeLegs.forEach((leg) => {
          const points = leg.geometry;
          L.polyline(points, { color: '#D4AF37', weight: 8, opacity: 0.45 }).addTo(group);
          L.polyline(points, { color: '#B84A39', weight: 4, opacity: 0.95 }).addTo(group);
        });

        if (showSubmergedProtected) {
          VENICE_SITES.filter((s) => s.type === 'submerged').forEach((zone) => {
            const c = L.circle([zone.lat, zone.lng], { radius: 300, color: '#F59E0B', weight: 2, dashArray: '6, 6', fillColor: '#F59E0B', fillOpacity: 0.25 }).addTo(group);
            c.bindTooltip(`<strong>🔒 ${zone.name}</strong><br/>300m Anti-Looting Buffer`);
            c.on('click', () => selectSite(zone));
          });
        }

        if (showFountains) {
          DRINKING_FOUNTAINS.forEach((f) => {
            const icon = L.divIcon({
              className: '',
              html: `<div style="width:22px;height:22px;border-radius:50%;background:#0284C7;border:2px solid #FFF;display:flex;align-items:center;justify-content:center;color:white;font-size:11px;box-shadow:0 2px 5px rgba(0,0,0,0.4);">💧</div>`,
              iconSize: [22, 22], iconAnchor: [11, 11]
            });
            const marker = L.marker([f.lat, f.lng], { icon }).addTo(group);
            marker.bindPopup(`<strong>${f.name}</strong><br/>${f.status}<br/><small>${f.veraNote}</small>`);
            marker.on('click', () => {
              selectResearchLocation({
                ...f,
                district: 'Venice',
                island: 'Main Island',
                yearFounded: '',
                description: f.status,
                historicalContext: f.veraNote
              }, 'Drinking Fountain');
            });
          });
        }

        const historicalLocationLayers = [
          { locations: VENETIAN_CHURCHES, nearby: nearbyFeatures.churches, showAll: showAllChurches, selectedId: selectedChurch?.id, label: 'Venetian Church', color: '#7C3AED', glyph: '✝' },
          { locations: VENETIAN_CONFRATERNITIES, nearby: nearbyFeatures.confraternities, showAll: showAllConfraternities, selectedId: selectedResearchLocation?.collectionLabel === 'Confraternity or Guild' ? selectedResearchLocation.id : null, label: 'Confraternity or Guild', color: '#B45309', glyph: '⚒' },
          { locations: VENETIAN_DOGES, nearby: nearbyFeatures.doges, showAll: showAllDoges, selectedId: selectedResearchLocation?.collectionLabel === 'Doge or Dynasty Location' ? selectedResearchLocation.id : null, label: 'Doge or Dynasty Location', color: '#0369A1', glyph: '♛' },
          { locations: VENETIAN_INSCRIPTIONS, nearby: nearbyFeatures.inscriptions, showAll: showAllInscriptions, selectedId: selectedResearchLocation?.collectionLabel === 'Inscription or Street Altar' ? selectedResearchLocation.id : null, label: 'Inscription or Street Altar', color: '#0F766E', glyph: '✎' }
        ];
        historicalLocationLayers.forEach((layer) => {
          const nearbyIds = new Set(layer.nearby.map((location) => location.id));
          const visibleLocations = layer.showAll
            ? layer.locations
            : layer.locations.filter((location) => nearbyIds.has(location.id) || layer.selectedId === location.id);
          visibleLocations.forEach((location) => {
            const isSelected = layer.selectedId === location.id;
            const icon = L.divIcon({
              className: '',
              html: `<div style="width:${isSelected ? 30 : 24}px;height:${isSelected ? 30 : 24}px;border-radius:50%;background:${layer.color};border:2px solid #FFF;display:flex;align-items:center;justify-content:center;color:white;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.45);">${layer.glyph}</div>`,
              iconSize: [30, 30], iconAnchor: [15, 15]
            });
            const marker = L.marker([location.lat, location.lng], { icon }).addTo(group);
            const popup = document.createElement('div');
            const title = document.createElement('strong');
            title.textContent = location.name;
            const address = document.createElement('p');
            address.textContent = `${location.district} · ${location.address}`;
            popup.append(title, address);
            if (location.artifactCategory) {
              const category = document.createElement('p');
              category.textContent = `${location.artifactCategory}${location.inscriptionType ? ` · ${location.inscriptionType}` : ''}`;
              popup.append(category);
            }
            marker.bindPopup(popup);
            marker.on('click', () => {
              selectResearchLocation(location, layer.label);
            });
            if (isSelected) marker.openPopup();
          });
        });

        if (activeMode === 'street-wander') {
          L.circle([userGpsPos.lat, userGpsPos.lng], { radius: scanRadiusMeters, color: '#10B981', weight: 1.5, fillColor: '#10B981', fillOpacity: 0.12 }).addTo(group);
          const uIcon = L.divIcon({
            className: '',
            html: `<div style="width:30px;height:30px;border-radius:50%;background:#10B981;border:3px solid #FFF;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 12px rgba(16,185,129,0.9);cursor:grab;">🚶</div>`,
            iconSize: [30, 30], iconAnchor: [15, 15]
          });
          const um = L.marker([userGpsPos.lat, userGpsPos.lng], { icon: uIcon, draggable: isDemoLocation }).addTo(group);
          um.bindTooltip(isDemoLocation ? "Drag me anywhere in Venice to set your demo location!" : "Your current location");
          if (isDemoLocation) {
            um.on('dragend', (e) => {
              const p = e.target.getLatLng();
              setUserGpsPos({ lat: Number(p.lat.toFixed(5)), lng: Number(p.lng.toFixed(5)), label: "Custom Demo Location" });
            });
          }
        }

        if (routeStartFromLocation && routeStartLocation && activeRouteIds.length > 0) {
          L.circleMarker([routeStartLocation.lat, routeStartLocation.lng], {
            radius: 8,
            color: '#FFFFFF',
            weight: 2,
            fillColor: '#10B981',
            fillOpacity: 1
          }).bindTooltip('Your route starts here').addTo(group);
        }

        VENICE_SITES.filter((s) => s.type !== 'submerged').forEach((site) => {
          const isSel = selectedSite?.id === site.id;
          const rIdx = activeRouteIds.indexOf(site.id);
          const isPreferredArtifact = rIdx === -1
            && getDistanceMeters(userGpsPos.lat, userGpsPos.lng, site.lat, site.lng) <= scanRadiusMeters;
          const bg = isSel ? '#D4AF37' : rIdx !== -1 ? '#B84A39' : isPreferredArtifact ? '#0284C7' : site.type === 'minor' ? '#0F2C36' : '#334155';
          const fg = isSel ? '#0F2C36' : '#FFFFFF';
          const label = rIdx !== -1 ? rIdx + 1 : isPreferredArtifact ? '✧' : site.type === 'minor' ? '✦' : '🏛';
          const sIcon = L.divIcon({
            className: '',
            html: `<div style="width:${isSel ? 34 : 28}px;height:${isSel ? 34 : 28}px;border-radius:50%;background:${bg};color:${fg};border:2.5px solid #F9F6F0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;box-shadow:0 3px 10px rgba(0,0,0,0.45);">${label}</div>`,
            iconSize: [30, 30], iconAnchor: [15, 15]
          });
          const m = L.marker([site.lat, site.lng], { icon: sIcon }).addTo(group);
          m.bindTooltip(`<strong>${site.name}</strong> (${site.sestiere})`);
          m.on('click', () => selectSite(site));
        });
      }, [activeRouteSites, routeLegs, activeRouteIds, selectedSite, selectedChurch, selectedResearchLocation, showFountains, showSubmergedProtected, showAllChurches, showAllConfraternities, showAllDoges, showAllInscriptions, nearbyFeatures, activeMode, userGpsPos, routeStartFromLocation, routeStartLocation, scanRadiusMeters, isDemoLocation, dataReady]);

      useEffect(() => {
        if (leafletMapRef.current && selectedSite) {
          setSelectedResearchLocation(null);
          leafletMapRef.current.panTo([selectedSite.lat, selectedSite.lng], { animate: true });
        }
      }, [selectedSite]);

      useEffect(() => {
        if (leafletMapRef.current && selectedResearchLocation) {
          leafletMapRef.current.panTo([selectedResearchLocation.lat, selectedResearchLocation.lng], { animate: true });
        }
      }, [selectedResearchLocation]);

      useEffect(() => {
        if (!leafletMapRef.current || !window.L || routeLegs.length === 0) return;
        const bounds = window.L.latLngBounds(routeLegs.flatMap((leg) => leg.geometry));
        if (bounds.isValid()) {
          leafletMapRef.current.fitBounds(bounds, { padding: [36, 36], maxZoom: 15 });
        }
      }, [routeLegs]);

      // Web Speech API Audio Narrator
      const stopAudioSpeech = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setIsPlayingAudio(false);
        setAudioProgress(0);
      };

      const getSiteNarration = (site) => `${site.name}, in ${site.sestiere}. Constructed in ${site.dateConstructed}. ${site.narrativeScript} Historical context: ${site.historicalContext} Fun fact: ${site.funFactlet} Tassini note: ${site.tassiniNote}`;
      const getResearchLocationNarration = (location) => [
        `${location.name}.`,
        location.district && `Located in ${location.district}.`,
        location.yearFounded && `Founded or built: ${location.yearFounded}.`,
        location.artifactCategory && `Artifact category: ${location.artifactCategory}.`,
        location.inscriptionType && `Inscription type: ${location.inscriptionType}.`,
        location.thematicClassification && `Theme: ${location.thematicClassification}.`,
        location.description,
        location.historicalContext && !location.artifactCategory
          && `Historical context: ${location.historicalContext}`,
        location.originalText && `Original inscription: ${location.originalText}`,
        location.englishTranslation && `English translation: ${location.englishTranslation}`,
        location.italianTranslation && `Italian translation: ${location.italianTranslation}`,
        location.conditionNotes && `Condition: ${location.conditionNotes}`,
        location.damageScale && `Scale of damage: ${location.damageScale} out of 5.`
      ].filter(Boolean).join(' ');

      const handleToggleAudioSpeech = (text) => {
        if (isPlayingAudio) { stopAudioSpeech(); return; }
        if (!text.trim()) return;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.onboundary = (e) => { if (e.charIndex) setAudioProgress(Math.min(100, Math.round((e.charIndex / text.length) * 100))); };
          u.onend = () => { setIsPlayingAudio(false); setAudioProgress(100); };
          u.onerror = (event) => {
            setIsPlayingAudio(false);
            if (event.error !== 'canceled' && event.error !== 'interrupted') {
              setMapStatusText(`Text-to-speech failed: ${event.error}`);
            }
          };
          setIsPlayingAudio(true);
          setAudioProgress(10);
          window.speechSynthesis.speak(u);
        } else {
          setMapStatusText("Text-to-speech is not supported in this browser.");
        }
      };

      useEffect(() => { stopAudioSpeech(); }, [selectedSite, selectedResearchLocation]);

      const renderAudioPlayer = (label, text) => (
        <div className="mt-2.5 p-2 rounded-xl bg-[#091D24] border border-slate-700 flex items-center gap-2.5">
          <button
            type="button"
            onClick={() => handleToggleAudioSpeech(text)}
            aria-label={isPlayingAudio ? 'Stop narration' : `Listen to ${label}`}
            aria-pressed={isPlayingAudio}
            className="w-8 h-8 rounded-lg bg-[#D4AF37] text-[#0F2C36] font-bold flex items-center justify-center flex-shrink-0"
          >
            {isPlayingAudio ? '⏸' : '▶'}
          </button>
          <div className="flex-1 min-w-0">
            <div className="flex justify-between text-[11px] mb-1">
              <span className="font-semibold text-[#D4AF37]">{isPlayingAudio ? 'Speaking...' : `Listen to ${label}`}</span>
              <span className="text-slate-400">{audioProgress}%</span>
            </div>
            <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
              <div className="h-full bg-[#D4AF37] transition-all" style={{ width: `${audioProgress}%` }} />
            </div>
          </div>
        </div>
      );

      const requestWalkingRoute = async (
        stopIds,
        startLocation = routeStartFromLocation ? routeStartLocation : null
      ) => {
        if (stopIds.length === 1 && !startLocation) {
          setMapStatusText("A one-stop route needs a starting location. Enable “Start from my current location”.");
          return;
        }
        const requestId = ++routeRequestIdRef.current;
        setIsBuildingRoute(true);
        setRouteLegs([]);
        setRouteSummary(null);
        setActiveRouteIds([]);
        setMapStatusText(startLocation
          ? "Finding a walking route from your current location..."
          : "Finding connected walking paths...");
        try {
          const response = await fetch('/api/routes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              stopIds,
              accessibleOnly,
              ...(startLocation ? { startLocation: { lat: startLocation.lat, lng: startLocation.lng } } : {})
            })
          });
          const result = await response.json();
          if (requestId !== routeRequestIdRef.current) return;
          if (!response.ok) throw new Error(result.error || `Route request failed (${response.status}).`);
          if (!Array.isArray(result.route) || result.route.length !== stopIds.length
            || !Array.isArray(result.legs)
            || result.legs.length !== stopIds.length - 1 + (startLocation ? 1 : 0)
            || result.startedFromCurrentLocation !== Boolean(startLocation)) {
            throw new Error("The routing service returned an incomplete walking route.");
          }
          const routeSites = result.route.map((id) => VENICE_SITES.find((site) => site.id === id));
          if (routeSites.some((site) => !site)) throw new Error("The server returned a route with an unknown landmark.");
          if (result.route.some((id, index) => id !== stopIds[index])) {
            throw new Error("The routing service changed your selected stop order.");
          }
          if (result.legs.some((leg) => !Array.isArray(leg.geometry) || leg.geometry.length < 2
            || leg.geometry.some((point) => !Array.isArray(point) || point.length !== 2
              || !point.every((coordinate) => Number.isFinite(coordinate)))
            || typeof leg.fromName !== 'string'
            || !Number.isFinite(Number(leg.distanceKm)) || !Number.isFinite(Number(leg.durationMinutes))
            || !Array.isArray(leg.instructions))) {
            throw new Error("The routing service returned an incomplete walking path.");
          }
          const distanceKm = Number(result.distanceKm);
          const durationMinutes = Number(result.durationMinutes);
          if (!Number.isFinite(distanceKm) || !Number.isFinite(durationMinutes)) {
            throw new Error("The routing service returned invalid route details.");
          }
          setActiveRouteIds(result.route);
          setRouteLegs(result.legs);
          setRouteSummary({ distanceKm, durationMinutes });
          selectSite(routeSites[0]);
          setMapStatusText(`${startLocation ? 'From your current location • ' : ''}${result.routingProvider}: ${distanceKm.toFixed(2)} km, about ${durationMinutes} min`);
        } catch (error) {
          if (requestId === routeRequestIdRef.current) {
            setMapStatusText(error.message || "Could not build the route. Please try again.");
          }
        } finally {
          if (requestId === routeRequestIdRef.current) setIsBuildingRoute(false);
        }
      };

      const handleBuildStoryRoute = () => requestWalkingRoute(selectedStopIds);

      const handleRouteStartLocationChange = (event) => {
        if (!event.target.checked) {
          setRouteStartFromLocation(false);
          setRouteStartLocation(null);
          clearActiveRoute();
          setMapStatusText("Route start reset to the first selected landmark.");
          return;
        }
        if (!navigator.geolocation) {
          setMapStatusText("Location is unavailable in this browser; use Near Me (GPS) to set a location.");
          return;
        }
        setMapStatusText("Getting your current location for the route...");
        navigator.geolocation.getCurrentPosition(
          ({ coords }) => {
            const location = {
              lat: coords.latitude,
              lng: coords.longitude,
              label: "Your location"
            };
            setRouteStartLocation(location);
            setUserGpsPos(location);
            setRouteStartFromLocation(true);
            clearActiveRoute();
            setMapStatusText("Current location acquired. Build a route to start there.");
          },
          (error) => {
            const message = error.code === error.PERMISSION_DENIED
              ? "Location permission was denied. Allow location access and try again."
              : error.code === error.TIMEOUT
                ? "Getting your location timed out. Try again."
                : "Could not get your location. Check device location settings.";
            setMapStatusText(message);
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
        );
      };

      useEffect(() => {
        if (dataReady) requestWalkingRoute(selectedStopIds);
      }, [dataReady]);

      const clearActiveRoute = () => {
        routeRequestIdRef.current += 1;
        setIsBuildingRoute(false);
        setActiveRouteIds([]);
        setRouteLegs([]);
        setRouteSummary(null);
      };

      const handleToggleLocationTracking = () => {
        if (gpsWatchIdRef.current !== null) {
          navigator.geolocation.clearWatch(gpsWatchIdRef.current);
          gpsWatchIdRef.current = null;
          setIsTrackingLocation(false);
          setMapStatusText("Live location stopped");
          return;
        }
        if (!navigator.geolocation) {
          setMapStatusText("Location is unavailable in this browser; drag the map pin instead.");
          return;
        }
        setIsDemoLocation(false);
        gpsWatchIdRef.current = navigator.geolocation.watchPosition(
          ({ coords }) => {
            setUserGpsPos({ lat: coords.latitude, lng: coords.longitude, label: "Your location" });
            setMapStatusText("Live location active — showing preferred nearby artifacts");
          },
          (error) => {
            const message = error.code === error.PERMISSION_DENIED
              ? "Location permission was denied; drag the map pin instead."
              : error.code === error.TIMEOUT
                ? "Location timed out; try again or drag the map pin."
                : "Could not track your location; check device location settings.";
            if (gpsWatchIdRef.current !== null) navigator.geolocation.clearWatch(gpsWatchIdRef.current);
            gpsWatchIdRef.current = null;
            setIsTrackingLocation(false);
            setMapStatusText(message);
          }, {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 15000
          }
        );
        setIsTrackingLocation(true);
      };

      useEffect(() => () => {
        if (gpsWatchIdRef.current !== null && navigator.geolocation) {
          navigator.geolocation.clearWatch(gpsWatchIdRef.current);
        }
      }, []);

      const handleSimulateWalkingStep = () => {
        const steps = [
          { siteId: 'calle-dei-fuseri', lat: 45.4356, lng: 12.3355, label: "Calle dei Fuseri", distance: '18m ahead', alertTitle: "Passing Tassini Street Origin & 1440 Guild Plaque!", alertBody: "Entering Calle dei Fuseri. Fontanella Campo San Luca is 42m away." },
          { siteId: 'rialto-bridge', lat: 45.4379, lng: 12.3358, label: "Rialto Bridge Approach", distance: '22m ahead', alertTitle: "Approaching Rialto Bridge (Antonio da Ponte, 1591)", alertBody: "Supported by 12,000 elm pilings driven into the Grand Canal's alluvial bank." },
          { siteId: 'ca-rezzonico', lat: 45.4334, lng: 12.3263, label: "Campo San Barnaba", distance: '15m on left', alertTitle: "Proximity Trigger: Ca' Rezzonico & 1575 Plague Altar", alertBody: "Longhena's Baroque palace (Cole Porter's 1920s nightclub) and the 1576 altar are within 60m!" },
          { siteId: 'peggy-guggenheim', lat: 45.4308, lng: 12.3318, label: "Dorsoduro Museum Mile", distance: '25m ahead', alertTitle: "Approaching Palazzo Venier dei Leoni (Peggy Guggenheim)", alertBody: "Known as the 'Palazzo Non Finito' because only its ground floor was built in 1749." }
        ];
        const next = wanderStepIndex % steps.length;
        setWanderStepIndex(next);
        const step = steps[next];
        setUserGpsPos({ lat: step.lat, lng: step.lng, label: step.label });
        setProximityAlert(step);
        const m = VENICE_SITES.find((s) => s.id === step.siteId);
        if (m) selectSite(m);
      };

      const handleExportGeoJSON = async () => {
        try {
          const response = await fetch('/api/geojson');
          if (!response.ok) throw new Error(`GeoJSON export failed (${response.status}).`);
          const geojson = await response.json();
          const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/geo+json" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = "ancient_venice_sites.geojson";
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (error) {
          setMapStatusText(error.message || "Could not export the site dataset.");
        }
      };

      const filteredCatalogSites = useMemo(() => {
        return VENICE_SITES.filter((s) => {
          const mSest = sestiereFilter === 'All' || s.sestiere.includes(sestiereFilter);
          const query = searchQuery.trim().toLowerCase();
          const searchableText = [s.name, s.italianName, s.sestiere, s.category, s.era, s.narrativeScript, s.historicalContext, s.contributionToHistory, s.funFactlet, s.tassiniNote].join(' ').toLowerCase();
          const mQ = searchableText.includes(query);
          return mSest && mQ;
        });
      }, [searchQuery, sestiereFilter]);

      if (dataLoadError) {
        return (
          <main className="min-h-screen flex flex-col items-center justify-center gap-4 p-6 text-center">
            <h1 className="text-xl font-bold">Could not load the Venice guide</h1>
            <p role="alert">{dataLoadError}</p>
            <p>Start the Python server with <code>python server.py</code>, then open <code>http://127.0.0.1:8000</code>.</p>
            <button onClick={() => setDataLoadAttempt((attempt) => attempt + 1)} className="rounded-lg bg-[#0F2C36] px-4 py-2 font-semibold text-white">Try again</button>
          </main>
        );
      }
      if (!dataReady) {
        return <main className="min-h-screen flex items-center justify-center p-6"><p role="status">Loading Venice research data...</p></main>;
      }

      return (
        <div
          className={`app-shell h-screen w-full flex flex-col overflow-hidden ${highContrast ? 'bg-slate-950 text-white' : 'bg-[#F9F6F0] text-[#1A252C]'}`}
          onPointerMove={(event) => {
            document.documentElement.style.setProperty('--pointer-x', `${event.clientX}px`);
            document.documentElement.style.setProperty('--pointer-y', `${event.clientY}px`);
          }}
        >
          {/* TOP HEADER */}
          <header className={`topbar z-30 border-b px-3 py-2 flex flex-wrap items-center justify-between gap-2 ${highContrast ? 'bg-slate-900 border-amber-400' : 'bg-[#0F2C36] border-[#1E4654] text-[#F9F6F0] shadow-md'}`}>
            <div className="flex items-center gap-2.5">
              <div className="brand-mark w-10 h-10 rounded-xl bg-[#B84A39] flex items-center justify-center font-bold shadow border border-[#D4AF37]/40">
                <Icon name="map" size={20} />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="hero-title font-bold text-xl tracking-tight">Ancient Venice</h1>
                  <span className="hero-badge text-[10px] uppercase font-semibold px-2.5 py-1 rounded-full bg-[#D4AF37]/20 text-[#D4AF37] border border-[#D4AF37]/40">Venice field guide</span>
                </div>
                <p className="text-[10px] text-slate-300 hidden sm:block">WPI Venice Project Center • Historical & Archaeological Navigator</p>
              </div>
            </div>

            {/* MODE TABS */}
            <nav className="flex items-center bg-[#091D24] p-1 rounded-xl border border-slate-700/70 gap-1 overflow-x-auto">
              {[
                { id: 'route-builder', label: 'Route Builder', icon: 'route' },
                { id: 'street-wander', label: 'Near Me (GPS)', icon: 'gps' },
                { id: 'historical-map', label: 'Historical Map (soon)', icon: 'map' },
                { id: 'research-hub', label: 'WPI Research', icon: 'book' }
              ].map((t) => (
                <button

                  onClick={() => setActiveMode(t.id)}
                  className={`px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap ${activeMode === t.id ? 'bg-[#B84A39] text-white' : 'text-slate-300 hover:text-white'}`}
                >
                  <Icon name={t.icon} size={14} /> <span>{t.label}</span>
                </button>
              ))}
            </nav>

            {/* ROUTE AND ACCESSIBILITY ACTIONS */}
            <div className="flex items-center gap-1.5">
              <a
                href={googleMapsRouteUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-700 hover:bg-emerald-600 text-white border border-emerald-400/40"
              >
                Google Maps <Icon name="arrow" size={14} />
              </a>
              <button
                onClick={() => setHighContrast(!highContrast)}
                className={`px-2 py-1.5 rounded-lg border text-xs font-semibold ${highContrast ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-200 border-slate-600'}`}
              >
                AA+
              </button>
            </div>
          </header>

          {/* MAIN WORKSPACE */}
          <div className="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
            
            {/* LEFT SIDEBAR */}
            <aside
              className={`workspace-sidebar z-20 w-full lg:w-[350px] flex-shrink-0 border-r flex flex-col overflow-y-auto p-3.5 space-y-3.5 max-h-[38vh] lg:max-h-none ${sidebarCollapsed ? 'workspace-sidebar--collapsed' : ''} ${highContrast ? 'bg-slate-900 border-amber-400/50' : 'bg-[#F9F6F0] border-[#E2D9C8]'}`}
              style={{ '--sidebar-width': `${panelSizes.sidebarWidth}px`, '--sidebar-height': `${panelSizes.sidebarHeight}px` }}
            >
              <button
                type="button"
                className="sidebar-toggle"
                onClick={() => setSidebarCollapsed((collapsed) => !collapsed)}
                aria-label={sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}
                aria-expanded={!sidebarCollapsed}
                title={sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}
              >
                <Icon name={sidebarCollapsed ? 'panelOpen' : 'panel'} size={17} />
                {!sidebarCollapsed && <span>Collapse panel</span>}
              </button>
              {!sidebarCollapsed && <div className="sidebar-content">
              {activeMode === 'route-builder' && (
                <>
                  <div className="route-hero p-4 rounded-xl bg-[#0F2C36] text-white border border-[#D4AF37]/30 reveal-on-scroll">
                    <div className="hero-badge-small"><span className="hero-badge-dot" />WPI VENICE PROJECT CENTER</div>
                    <h2 className="route-hero-title">Choose Your Walking Stops</h2>
                    <p className="text-xs text-slate-200">Choose 1–5 landmarks. Routes can begin at the first landmark or at your current location.</p>
                    <div className="route-metrics">
                      <div className="metric-card">
                        <Icon name="distance" size={16} />
                        <span className="metric-value">{routeStats.distanceKm} km</span>
                        <span className="metric-label">Distance</span>
                      </div>
                      <div className="metric-card">
                        <Icon name="clock" size={16} />
                        <span className="metric-value">~{routeStats.walkMins}m</span>
                        <span className="metric-label">Walking time</span>
                      </div>
                      <div className="metric-card">
                        <Icon name="pin" size={16} />
                        <span className="metric-value">{selectedStopIds.length} / 5</span>
                        <span className="metric-label">Selected stops</span>
                      </div>
                    </div>
                  </div>

                  <div className="landmark-list space-y-1 reveal-on-scroll">
                    <div className="flex justify-between items-center">
                      <h3 className="text-xs font-bold uppercase">Available Landmarks</h3>
                      <span className={`text-[10px] font-bold ${selectedStopIds.length >= 1 && selectedStopIds.length <= 5 ? 'text-emerald-700' : 'text-[#B84A39]'}`}>{selectedStopIds.length} / 5 selected</span>
                    </div>

                              {location.englishTranslation && <p><strong>English translation:</strong> {location.englishTranslation}</p>}
                              {location.italianTranslation && <p><strong>Italian translation:</strong> {location.italianTranslation}</p>}
                              {location.conditionNotes && <p><strong>Condition:</strong> {location.conditionNotes} {location.damageScale && `(damage ${location.damageScale}/5)`}</p>}
                              {location.historicalContext && <p><strong>Historical context:</strong> {location.historicalContext}</p>}
                              <button
                                type="button"
                                onClick={() => {
                                  selectResearchLocation(location, 'Inscription or Street Altar');
                                  setMapStatusText(`Map focused on ${location.name}`);
                                }}
                                className="mt-1 px-2 py-1 rounded bg-teal-800 text-white text-[10px] font-semibold"
                              >
                                Show point on map
                              </button>
                            </div>
                          </details>
                        ))}
                      </div>
                    </details>
                  </section>
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold uppercase text-[#B84A39]">WPI Research Catalog</span>
                    <button onClick={handleExportGeoJSON} className="icon-action px-2 py-1 rounded bg-[#0F2C36] text-[#D4AF37] text-[10px] font-bold"><Icon name="download" size={13} /> Export GeoJSON</button>
                  </div>
                  <label className="search-field">
                    <Icon name="search" size={15} />
                    <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search Ca' Rezzonico, Longhena..." className="w-full px-2.5 py-1.5 rounded-lg border border-[#D5CBB8] bg-white text-slate-900 text-xs" />
                  </label>
                  <select value={sestiereFilter} onChange={(e) => setSestiereFilter(e.target.value)} aria-label="Filter by district" className="w-full px-2.5 py-1.5 rounded-lg border border-[#D5CBB8] bg-white text-slate-900 text-xs">
                    <option value="All">All districts</option>
                    {[...new Set(VENICE_SITES.map((site) => site.sestiere))].sort().map((sestiere) => <option key={sestiere} value={sestiere}>{sestiere}</option>)}
                  </select>
                  <div className="space-y-1">
                    {filteredCatalogSites.map((s) => (
                      <div key={s.id} onClick={() => selectSite(s)} className="p-2 rounded-lg bg-white text-slate-900 border border-[#E2D9C8] cursor-pointer flex justify-between items-center text-xs">
                        <span className="font-bold truncate pr-2">{s.name}</span>
                        <span className="text-[10px] opacity-70">{s.sestiere}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              </div>}
            </aside>
            <button
              type="button"
              className={`panel-resizer ${sidebarCollapsed ? 'panel-resizer--hidden' : ''}`}
              role="separator"
              aria-label="Resize landmark panel"
              aria-orientation={compactLayout ? 'horizontal' : 'vertical'}
              aria-valuenow={compactLayout ? panelSizes.sidebarHeight : panelSizes.sidebarWidth}
              onPointerDown={(event) => beginPanelResize('sidebar', event)}
              onPointerMove={movePanelResize}
              onPointerUp={stopPanelResize}
              onPointerCancel={stopPanelResize}
              onKeyDown={(event) => handlePanelResizeKeyDown('sidebar', event)}
              title="Drag to resize landmark panel"
            >
              <span />
            </button>

            {/* CENTER INTERACTIVE MAP */}
            <main className="map-stage flex-1 relative bg-[#0B222B] overflow-hidden flex flex-col justify-between min-h-[320px]">
              {/* Top Floating Map Style Switcher */}
              <div className="z-20 m-2.5 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
                <div className="map-glass pointer-events-auto bg-[#0F2C36]/95 text-[#F9F6F0] px-3 py-1 rounded-xl border border-[#D4AF37]/40 shadow text-xs flex items-center gap-2 reveal-on-scroll">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping" />
                  <span>{mapStatusText}</span>
                </div>
                <div className="map-glass pointer-events-auto flex flex-wrap items-center gap-1 bg-[#0F2C36]/95 p-1 rounded-xl border border-slate-700 shadow text-xs">
                  <button onClick={() => setGoogleMapTileStyle('roadmap')} className={`px-2 py-1 rounded-lg font-semibold ${googleMapTileStyle === 'roadmap' ? 'bg-[#B84A39] text-white' : 'text-slate-300'}`}>Street map</button>
                  <button onClick={() => setGoogleMapTileStyle('satellite')} className={`px-2 py-1 rounded-lg font-semibold ${googleMapTileStyle === 'satellite' ? 'bg-[#B84A39] text-white' : 'text-slate-300'}`}>Satellite</button>
                  <label className="flex items-center gap-1.5 px-2 py-1 text-slate-200 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={showAllChurches}
                      onChange={(event) => setShowAllChurches(event.target.checked)}
                      aria-label="Show all Venetian church points on the map"
                      className="accent-violet-500"
                    />
                    All churches
                  </label>
                  <label className="flex items-center gap-1.5 px-2 py-1 text-slate-200 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={showAllConfraternities}
                      onChange={(event) => setShowAllConfraternities(event.target.checked)}
                      aria-label="Show all confraternity and guild points on the map"
                      className="accent-amber-500"
                    />
                    All confraternities & guilds
                  </label>
                  <label className="flex items-center gap-1.5 px-2 py-1 text-slate-200 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={showAllDoges}
                      onChange={(event) => setShowAllDoges(event.target.checked)}
                      aria-label="Show all doge and dynasty points on the map"
                      className="accent-sky-500"
                    />
                    All doges & dynasties
                  </label>
                  <label className="flex items-center gap-1.5 px-2 py-1 text-slate-200 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={showAllInscriptions}
                      onChange={(event) => setShowAllInscriptions(event.target.checked)}
                      aria-label="Show all inscription and street altar points on the map"
                      className="accent-teal-500"
                    />
                    All inscriptions & street altars
                  </label>
                </div>
              </div>

              <div ref={mapContainerRef} className="absolute inset-0 w-full h-full" />

              {/* Bottom Map Legend */}
              <div className="z-20 m-2.5 pointer-events-none flex justify-between items-center">
                <div className="map-glass pointer-events-auto bg-[#0F2C36]/90 px-3 py-1.5 rounded-xl border border-slate-700 text-[11px] text-slate-200 flex flex-wrap gap-3 shadow reveal-on-scroll">
                  <span>🔴 Route Stop</span>
                  <span>🔹 Preferred nearby artifact</span>
                  <span>✦ Tassini / Altar</span>
                  <span>🔒 300m Obfuscated Dig</span>
                  <span>💧 Potable Fountain</span>
                  <span>✝ Venetian Church</span>
                  <span>⚒ Confraternity / Guild</span>
                  <span>♛ Doge / Dynasty</span>
                  <span>✎ Inscription / Street Altar</span>
                </div>
              </div>
            </main>

            {/* RIGHT RESEARCH & AUDIO STORY DRAWER */}
            {(selectedSite || selectedResearchLocation) && (
              <>
              <button
                type="button"
                className="panel-resizer panel-resizer--research"
                role="separator"
                aria-label="Resize research panel"
                aria-orientation={compactLayout ? 'horizontal' : 'vertical'}
                aria-valuenow={compactLayout ? panelSizes.researchHeight : panelSizes.researchWidth}
                onPointerDown={(event) => beginPanelResize('research', event)}
                onPointerMove={movePanelResize}
                onPointerUp={stopPanelResize}
                onPointerCancel={stopPanelResize}
                onKeyDown={(event) => handlePanelResizeKeyDown('research', event)}
                title="Drag to resize research panel"
              >
                <span />
              </button>
              <section
                className={`research-drawer z-20 w-full lg:w-[390px] flex-shrink-0 border-l flex flex-col overflow-y-auto max-h-[45vh] lg:max-h-none ${highContrast ? 'bg-slate-900 border-amber-400' : 'bg-[#F9F6F0] border-[#E2D9C8] shadow-xl'}`}
                style={{ '--research-width': `${panelSizes.researchWidth}px`, '--research-height': `${panelSizes.researchHeight}px` }}
              >
                {selectedResearchLocation ? (
                  <>
                    <div className="p-3.5 bg-[#0F2C36] text-[#F9F6F0] border-b border-[#D4AF37]/30 sticky top-0 z-10">
                      <div className="flex flex-wrap items-center justify-between gap-1 mb-2">
                        <div className="flex gap-1.5">
                          <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-[#B84A39] text-white">{selectedResearchLocation.district}</span>
                          <span className="text-[10px] font-semibold px-2 py-0.5 rounded bg-white/10 text-[#D4AF37]">{selectedResearchLocation.collectionLabel}</span>
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            setSelectedResearchLocation(null);
                            setSelectedChurch(null);
                          }}
                          className="text-[10px] font-bold px-2 py-0.5 rounded bg-white/10 hover:bg-white/20 text-white"
                        >
                          Close details
                        </button>
                      </div>
                      <h2 className="text-base font-bold leading-snug" style={{ fontFamily: "'Georgia', serif" }}>{selectedResearchLocation.name}</h2>
                      <p className="text-[11px] text-slate-300">
                        {[selectedResearchLocation.address, selectedResearchLocation.island].filter(Boolean).join(' · ')}
                      </p>
                      {renderAudioPlayer('Point', getResearchLocationNarration(selectedResearchLocation))}
                    </div>
                    <div className="research-drawer-body p-3.5 space-y-3 text-xs leading-relaxed">
                      {selectedResearchLocation.collectionLabel === 'Inscription or Street Altar' && (
                        <>
                          <div className="p-3 rounded-xl bg-teal-50 text-slate-900 border border-teal-200">
                            <h3 className="text-[10px] font-bold uppercase text-teal-800 mb-1">Inscription record</h3>
                            <p><strong>Category:</strong> {selectedResearchLocation.artifactCategory}</p>
                            <p><strong>Type:</strong> {selectedResearchLocation.inscriptionType}</p>
                            {selectedResearchLocation.thematicClassification && <p><strong>Theme:</strong> {selectedResearchLocation.thematicClassification}</p>}
                            {selectedResearchLocation.damageScale && <p><strong>Scale of damage:</strong> {selectedResearchLocation.damageScale}/5</p>}
                            {selectedResearchLocation.conditionNotes && <p className="mt-1"><strong>Condition notes:</strong> {selectedResearchLocation.conditionNotes}</p>}
                          </div>
                          {(selectedResearchLocation.originalText || selectedResearchLocation.englishTranslation || selectedResearchLocation.italianTranslation) && (
                            <div className="p-3 rounded-xl bg-white text-slate-900 border border-[#E2D9C8] space-y-2">
                              <h3 className="text-[10px] font-bold uppercase text-[#B84A39]">Inscription text & translations</h3>
                              {selectedResearchLocation.originalText && <p className="whitespace-pre-wrap"><strong>Original:</strong><br />{selectedResearchLocation.originalText}</p>}
                              {selectedResearchLocation.englishTranslation && <p className="whitespace-pre-wrap"><strong>English translation:</strong><br />{selectedResearchLocation.englishTranslation}</p>}
                              {selectedResearchLocation.italianTranslation && <p className="whitespace-pre-wrap"><strong>Italian translation:</strong><br />{selectedResearchLocation.italianTranslation}</p>}
                            </div>
                          )}
                          <div className="rounded-xl border border-[#E2D9C8] bg-white text-slate-700 p-2 text-[10px] break-all">
                            <strong>Survey ObjectID:</strong> {selectedResearchLocation.surveyObjectId || 'Not recorded'}<br />
                            <strong>GlobalID:</strong> {selectedResearchLocation.globalId || 'Not recorded'}<br />
                            <strong>Lapidi ID:</strong> {selectedResearchLocation.lapidiId || 'Not recorded'}
                          </div>
                        </>
                      )}
                      {(selectedResearchLocation.description || selectedResearchLocation.historicalContext) && (
                        <div className="p-3 rounded-xl bg-white text-slate-900 border border-[#E2D9C8]">
                          <h3 className="text-[10px] font-bold uppercase text-[#B84A39] mb-1">Historical facts</h3>
                          {selectedResearchLocation.description && <p>{selectedResearchLocation.description}</p>}
                          {selectedResearchLocation.historicalContext && (
                            <p className="mt-2 pt-2 border-t text-[11px] text-slate-700"><strong>Historical context:</strong> {selectedResearchLocation.historicalContext}</p>
                          )}
                        </div>
                      )}
                      <div className="rounded-xl border border-[#E2D9C8] overflow-hidden bg-white text-slate-900">
                        <div className="px-3 py-1.5 bg-[#EFE9DD] font-bold text-[10px] uppercase flex justify-between">
                          <span>Location record</span>
                          <span>{selectedResearchLocation.lat}°N, {selectedResearchLocation.lng}°E</span>
                        </div>
                        <div className="divide-y text-[11px]">
                          {selectedResearchLocation.yearFounded && <div className="p-2 flex justify-between gap-3"><span className="font-semibold opacity-75">Founded / built:</span><span className="text-right">{selectedResearchLocation.yearFounded}</span></div>}
                          {selectedResearchLocation.district && <div className="p-2 flex justify-between gap-3"><span className="font-semibold opacity-75">District:</span><span className="text-right">{selectedResearchLocation.district}</span></div>}
                          {selectedResearchLocation.address && <div className="p-2 flex justify-between gap-3"><span className="font-semibold opacity-75">Address:</span><span className="text-right">{selectedResearchLocation.address}</span></div>}
                        </div>
                      </div>
                    </div>
                  </>
                ) : selectedSite && (
                  <>
                <div className="p-3.5 bg-[#0F2C36] text-[#F9F6F0] border-b border-[#D4AF37]/30 sticky top-0 z-10">
                  <div className="flex flex-wrap items-center justify-between gap-1 mb-1">
                    <div className="flex gap-1.5">
                      <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-[#B84A39] text-white">{selectedSite.sestiere}</span>
                      <span className="text-[10px] font-semibold px-2 py-0.5 rounded bg-white/10 text-[#D4AF37]">{selectedSite.category}</span>
                    </div>
                    <button onClick={() => setShowGoogleEmbedModal(true)} className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white">
                      🌍 Google Map View
                    </button>
                  </div>
                  <h2 className="text-base font-bold leading-snug" style={{ fontFamily: "'Georgia', serif" }}>{selectedSite.name}</h2>
                  <p className="text-[11px] text-slate-300 italic">{selectedSite.italianName}</p>

                  {renderAudioPlayer('Story', getSiteNarration(selectedSite))}
                </div>

                {/* Standardized 8-Point WPI Research Questions Body */}
                <div className="research-drawer-body p-3.5 space-y-3 text-xs leading-relaxed">
                  <div className="p-3 rounded-xl bg-white text-slate-900 border border-[#E2D9C8]">
                    <h3 className="text-[10px] font-bold uppercase text-[#B84A39] mb-1">📖 Narrative & Historical Context</h3>
                    <p>{selectedSite.narrativeScript}</p>
                    <p className="mt-2 pt-2 border-t text-[11px] text-slate-700"><strong>Historical Context:</strong> {selectedSite.historicalContext}</p>
                    <p className="mt-1 text-[11px] text-slate-700"><strong>Contribution to Venice History:</strong> {selectedSite.contributionToHistory}</p>
                  </div>

                  <div className="p-2.5 rounded-xl bg-amber-500/10 border border-[#D4AF37]/50">
                    <div className="font-bold text-[#B84A39] uppercase text-[10px] mb-0.5">✨ Fun Factlet</div>
                    <p>{selectedSite.funFactlet}</p>
                  </div>

                  <div className="p-2.5 rounded-xl bg-[#0F2C36]/5 border border-[#0F2C36]/20">
                    <div className="font-bold text-[#0F2C36] uppercase text-[10px] mb-0.5">🏛️ Giuseppe Tassini Street Note</div>
                    <p>{selectedSite.tassiniNote}</p>
                  </div>

                  <div className="rounded-xl border border-[#E2D9C8] overflow-hidden bg-white text-slate-900">
                    <div className="px-3 py-1.5 bg-[#EFE9DD] font-bold text-[10px] uppercase flex justify-between">
                      <span>WPI Location Record</span>
                      <span>{selectedSite.lat}°N, {selectedSite.lng}°E</span>
                    </div>
                    <div className="divide-y text-[11px]">
                      <div className="p-2 flex justify-between gap-3"><span className="font-semibold opacity-75">Constructed:</span><span className="text-right">{selectedSite.dateConstructed}</span></div>
                      <div className="p-2 flex justify-between gap-3"><span className="font-semibold opacity-75">Renovations:</span><span className="text-right">{selectedSite.renovations}</span></div>
                      <div className="p-2 flex justify-between gap-3"><span className="font-semibold opacity-75">Status:</span><span className="text-right font-semibold text-emerald-700">{selectedSite.status}</span></div>
                      <div className="p-2 flex justify-between gap-3"><span className="font-semibold opacity-75">Anti-Looting:</span><span className="text-right">{selectedSite.lootingRisk}</span></div>
                    </div>
                  </div>
                </div>
                  </>
                )}
              </section>
              </>
            )}
          </div>

          {/* EMBEDDED GOOGLE MAPS MODAL */}
          {showGoogleEmbedModal && selectedSite && !selectedResearchLocation && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-[#F9F6F0] text-[#1A252C] max-w-2xl w-full rounded-2xl shadow-2xl border border-[#D4AF37] overflow-hidden flex flex-col">
                <div className="p-3.5 bg-[#0F2C36] text-white flex justify-between items-center">
                  <div>
                    <h3 className="font-bold text-sm">Google Maps Live View: {selectedSite.name}</h3>
                    <p className="text-[11px] text-slate-300">{selectedSite.lat}° N, {selectedSite.lng}° E ({selectedSite.sestiere})</p>
                  </div>
                  <button onClick={() => setShowGoogleEmbedModal(false)} className="px-2.5 py-1 rounded bg-white/10 text-white text-xs">✕ Close</button>
                </div>
                <div className="w-full h-[380px] bg-slate-200">
                  <iframe
                    title="Google Maps View"
                    width="100%"
                    height="100%"
                    style={{ border: 0 }}
                    loading="lazy"
                    allowFullScreen
                    src={`https://maps.google.com/maps?q=${selectedSite.lat},${selectedSite.lng}&z=18&output=embed`}
                  />
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
